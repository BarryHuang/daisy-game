<script>
// CET 二上 Wk 6：lie / wide / island / flow / popular
//                survive / salty / human / produce / breathe
//
// 句子全部取自課本原句（Continents and Oceans, Nancy Kelly Allen,
// Rubicon Publishing, Level H）—— 她在課堂上讀過的句子，複習時認得出來。
startClozeQuiz({
  title: 'CET Week 6 — 選擇填空',
  subtitle: '二上 · CET Vocabulary ｜ Week 6 ｜ 10 題',
  accent: '#00796b',
  questions: [
    { sentence: 'Valleys ___ between hills or mountains.',
      answer: 'lie', wrong: ['flow', 'climb'], source: 'CET Wk 6' },

    { sentence: 'It is about 1 mile deep and 18 miles ___.',
      answer: 'wide', wrong: ['thick', 'steep'], source: 'CET Wk 6' },

    { sentence: 'Greenland is the world\'s largest ___.',
      answer: 'island', wrong: ['valley', 'continent'], source: 'CET Wk 6' },

    { sentence: 'Rivers ___ to other rivers, lakes, and even oceans.',
      answer: 'flow', wrong: ['lie', 'freeze'], source: 'CET Wk 6' },

    { sentence: 'River rafting is a ___ activity.',
      answer: 'popular', wrong: ['natural', 'strange'], source: 'CET Wk 6' },

    { sentence: 'Plants and animals cannot ___ there.',
      answer: 'survive', wrong: ['breathe', 'produce'], source: 'CET Wk 6' },

    { sentence: 'Ocean water is ___.',
      answer: 'salty', wrong: ['shallow', 'thick'], source: 'CET Wk 6' },

    { sentence: 'Oceans are important to ___.',
      answer: 'humans', lemma: 'human', wrong: ['creatures', 'features'], source: 'CET Wk 6' },

    { sentence: 'Tiny ocean plants ___ oxygen.',
      answer: 'produce', wrong: ['collect', 'breathe'], source: 'CET Wk 6' },

    { sentence: 'Humans need oxygen to ___.',
      answer: 'breathe', wrong: ['survive', 'freeze'], source: 'CET Wk 6' },

  ]
});
</script>
