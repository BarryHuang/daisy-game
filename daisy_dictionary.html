<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📖 查單字</title>
<link rel="manifest" href="./manifest_dictionary.json">
<meta name="theme-color" content="#7b1fa2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="查單字">
<link rel="apple-touch-icon" href="./dict-icon-192.png">
<style>
:root{
  --primary:#ff85a2; --secondary:#8ba4f9; --deep:#7b1fa2;
  --ink:#38364a; --muted:#7c7a8d; --line:#ece9f4; --card:#fff;
  --gold:#f6a821; --teal:#0f8a7e;
  /* 內文改用清晰字體：長單字和多筆釋義用 Comic Sans 會很難讀 */
  --read:"Noto Sans TC","PingFang TC","Helvetica Neue",Arial,sans-serif;
  --play:'Comic Sans MS','Chalkboard SE',var(--read);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--read);color:var(--ink);
     background:linear-gradient(160deg,#fff8f0 0%,#ffecd2 50%,#fff3e0 100%);
     min-height:100vh;padding-bottom:calc(40px + env(safe-area-inset-bottom))}

.page-header{background:linear-gradient(135deg,#4a148c,#7b1fa2 50%,#ab47bc);
  padding:14px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);position:sticky;top:0;z-index:10}
.page-header h1{color:#fff;font-size:1.25rem;flex:1;font-family:var(--play);
  text-shadow:1px 2px 5px rgba(0,0,0,.35)}
.back-btn{background:rgba(255,255,255,.22);color:#fff;border:2px solid rgba(255,255,255,.45);
  padding:7px 15px;border-radius:20px;font-size:.9rem;font-weight:bold;text-decoration:none}

.wrap{max-width:640px;margin:0 auto;padding:0 14px}

.searchbox{position:relative;margin-top:14px;position:sticky;top:0;z-index:9;
  padding:10px 0;background:linear-gradient(180deg,#fff8f0 72%,rgba(255,248,240,0))}
.searchbox input{width:100%;font-family:var(--read);font-size:1.15rem;font-weight:600;
  padding:15px 46px 15px 16px;border:3px solid var(--secondary);border-radius:18px;
  background:#fff;color:var(--ink);outline:none;box-shadow:0 4px 0 #6b83d4}
.searchbox input::placeholder{color:#b3b0c2;font-weight:400}
.searchbox input:focus{border-color:var(--primary);box-shadow:0 4px 0 #e0607f}
.searchbox .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  border:0;background:#f0eef8;color:var(--muted);width:30px;height:30px;border-radius:50%;
  font-size:1rem;cursor:pointer;display:none}
.searchbox .clear.on{display:block}
.searchbox.has-mic input{padding-right:84px}
.searchbox.has-mic .clear{right:46px}
.mic{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  border:0;background:var(--primary);color:#fff;width:32px;height:32px;border-radius:50%;
  font-size:1rem;cursor:pointer;display:none;line-height:1}
.searchbox.has-mic .mic{display:block}
.mic.listening{animation:mic-pulse 1s ease-in-out infinite}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,133,162,.7)}50%{box-shadow:0 0 0 9px rgba(255,133,162,0)}}
@media (prefers-reduced-motion:reduce){.mic.listening{animation:none;outline:3px solid var(--primary)}}
.tip{font-size:.82rem;color:var(--muted);margin:9px 4px 0;line-height:1.6}
.tip code{background:#f0eef8;border-radius:5px;padding:1px 5px;font-size:.95em}

.card{background:var(--card);border-radius:20px;box-shadow:0 6px 22px rgba(0,0,0,.09);
  padding:16px;margin-top:14px}
.card.mine{border:3px solid var(--gold)}

.badge{display:inline-block;font-size:.72rem;font-weight:800;border-radius:99px;
  padding:4px 11px;margin-bottom:10px;font-family:var(--read)}
.badge.mine{background:#fff4dc;color:#a86a00}
.badge.dict{background:#eef1fd;color:#4459a8}

.headword{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.headword .en{font-size:1.7rem;font-weight:800;letter-spacing:-.01em;word-break:break-word}
.headword .from{font-size:.8rem;color:var(--muted)}

.sense{border-top:1px solid var(--line);padding:12px 0 4px;display:flex;
  gap:10px;align-items:flex-start;flex-wrap:wrap}
.sense:first-of-type{border-top:0}
.sense .zh{font-size:1.85rem;line-height:2;flex:1;min-width:150px}
.sense .gloss{font-size:.85rem;color:var(--muted);flex-basis:100%;margin-top:-4px}
.sense .note{font-size:.78rem;color:var(--teal);font-weight:700}

.say{flex:0 0 auto;align-self:center;background:var(--secondary);color:#fff;border:0;border-radius:14px;padding:7px 13px;
  font-size:.82rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #6b83d4;font-family:var(--read)}
.say-zh{background:var(--primary);box-shadow:0 3px 0 #e0607f}
.say:active{transform:translateY(3px);box-shadow:none}

.add{border:0;background:#fff4dc;color:#a86a00;border-radius:14px;padding:7px 12px;
  font-size:.82rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #e8c98a;font-family:var(--read)}
.add.on{background:#f6a821;color:#fff;box-shadow:0 3px 0 #c07f00}
.add:active{transform:translateY(3px);box-shadow:none}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10001;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:10002;
  width:min(420px,100%);background:#fff;border-radius:22px 22px 0 0;padding:18px 16px
  calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25);display:none}
.sheet.on{display:block}
.sheet h3{font-size:1.05rem;margin-bottom:3px}
.sheet .sub{font-size:.8rem;color:var(--muted);margin-bottom:12px}
.sheet .row{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:13px;
  border:2px solid var(--line);margin-bottom:8px;cursor:pointer;background:#fff}
.sheet .row.in{border-color:#f6a821;background:#fff9ec}
.sheet .row b{flex:1;font-size:.98rem}
.sheet .row span{font-size:.78rem;color:var(--muted)}
.sheet .new{display:flex;gap:8px;margin-top:4px}
.sheet .new input{flex:1;padding:11px;border:2px solid var(--line);border-radius:13px;
  font-size:1rem;font-family:var(--read);outline:none}
.sheet .new input:focus{border-color:#f6a821}
.sheet .new button{border:0;background:#f6a821;color:#fff;border-radius:13px;padding:0 16px;
  font-weight:800;cursor:pointer;font-family:var(--read)}
.sheet .close{width:100%;margin-top:12px;padding:11px;border:0;border-radius:14px;
  background:#f0eef8;color:var(--muted);font-weight:700;font-family:var(--read);cursor:pointer}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:10003;
  background:rgba(40,38,55,.94);color:#fff;padding:10px 18px;border-radius:99px;
  font-size:.9rem;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.recent{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:#fff;border:2px solid var(--line);border-radius:99px;padding:6px 13px;
  font-size:.9rem;font-weight:700;cursor:pointer;color:var(--ink)}
.chip:active{transform:scale(.96)}

.state{text-align:center;padding:34px 16px;color:var(--muted)}
.state .big{font-size:2.6rem;display:block;margin-bottom:10px}
.state b{color:var(--ink)}
.loading{height:3px;background:linear-gradient(90deg,var(--primary),var(--secondary));
  border-radius:99px;margin-top:12px;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.loading{animation:none;opacity:.6}}
h2.sec{font-size:.8rem;color:var(--muted);letter-spacing:.08em;font-weight:800;
  margin:22px 4px 0}

/* iPad 分割畫面最窄約 320pt。注音是中文字級的 0.36em，中文一縮小注音就先
   看不清了（1.5rem 的中文 = 8.6px 的注音），所以窄欄一律從留白和英文字級
   擠空間，.sense .zh 維持 1.7rem 不動。 */
@media (max-width:430px){
  .wrap{padding:0 10px}
  .page-header{padding:10px 12px}
  .page-header h1{font-size:1.05rem}
  .back-btn{padding:6px 11px;font-size:.82rem}
  .card{padding:12px;border-radius:16px;margin-top:10px}
  .searchbox input{font-size:1.05rem;padding:13px 44px 13px 13px}
  .headword .en{font-size:1.45rem}
  .sense{padding:10px 0 3px;gap:8px}
  .sense .zh{font-size:1.7rem;min-width:110px}   /* 注音的下限，不能再小 */
  .say{padding:6px 10px;font-size:.78rem}
  .tip{font-size:.76rem;margin-top:7px}
  .badge{font-size:.68rem;padding:3px 9px;margin-bottom:8px}
  .chip{padding:5px 11px;font-size:.85rem}
  h2.sec{margin-top:16px}
}
</style>
</head>
<body>
<div class="page-header">
  <a class="back-btn" href="./daisy_hamster.html">← 返回</a>
  <h1>📖 查單字</h1>
</div>

<div class="wrap">
  <div class="searchbox">
    <input id="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="none"
           spellcheck="false" placeholder="打一個英文單字">
    <button class="clear" id="clear" aria-label="清除">✕</button>
    <button class="mic" id="mic" aria-label="用說的">🎤</button>
  </div>
  <p class="tip" id="tip">文章裡看到不會的字就打進來。<code>hesitated</code>、<code>mice</code> 這種變化形也查得到。</p>
  <div id="out"></div>
</div>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet">
  <h3 id="sheet-title">加入單字卡</h3>
  <div class="sub" id="sheet-sub"></div>
  <div id="sheet-lists"></div>
  <div class="new">
    <input id="sheet-new" placeholder="新清單的名字" maxlength="24">
    <button id="sheet-add">建立</button>
  </div>
  <button class="close" id="sheet-close">關閉</button>
</div>
<div class="toast" id="toast"></div>
<div style="display:none">
</div>

<script src="./words.js"></script>
<script src="./zhuyin.js"></script>
<script src="./inflect.js"></script>
<script src="./firebase-config.js"></script>
<script src="./lookups.js"></script>
<script src="./wordlists.js"></script>
<script>
// ---------- 語音 ----------
function speak(text, lang) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = lang.startsWith("zh") ? 0.85 : 0.8;
  speechSynthesis.speak(u);
}
// 屬性用單引號包，JSON 的雙引號才不會把 onclick="" 截斷
function attr(value) {
  return JSON.stringify(String(value)).replace(/'/g, "&#39;");
}
function sayBtn(text, lang, label) {
  return `<button class="say ${lang.startsWith("zh") ? "say-zh" : ""}"
    onclick='speak(${attr(text)},"${lang}")'>🔊 ${label}</button>`;
}

// ---------- 大字典（延後載入，不擋住課表查詢）----------
let cedictReady = false, cedictLoading = null;
function loadCedict() {
  if (cedictLoading) return cedictLoading;
  cedictLoading = new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = "./cedict.js";
    s.onload = () => { cedictReady = true; resolve(true); };
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
  return cedictLoading;
}

function cedictLookup(form) {
  if (!cedictReady || !CEDICT.i[form]) return null;
  return CEDICT.i[form].map((id) => ({
    zh: CEDICT.w[id],
    z: CEDICT.z[id].split(",").map((n) => CEDICT.s[+n]),
    gloss: CEDICT.g[id]
  }));
}

// ---------- 她自己的單字表優先 ----------
function curriculumLookup(form) {
  const e = typeof lookupWord === "function" ? lookupWord(form) : null;
  return e ? e : null;
}

// ---------- 畫面 ----------
function renderCurriculum(word, entry) {
  const senses = entry.s.map((s) => `
    <div class="sense">
      <div class="zh zy-line">${renderZhuyin(s.zh, s.z)}</div>
      ${sayBtn(s.zh, "zh-TW", "中")}
      ${s.note ? `<span class="note">${s.note}</span>` : ""}
    </div>`).join("");
  // 來源從 curriculum 即時推導；本學期的優先顯示
  const all = typeof wordSources === "function" ? wordSources(word) : [];
  const pick = all.find((x) => x.term === CURRENT_TERM) || all[0];
  const from = pick ? pick.text : "";
  return `<div class="card mine">
    <span class="badge mine">⭐ 你的單字表${from ? " · " + from : ""}</span>
    <div class="headword"><span class="en">${word}</span>${sayBtn(word, "en-US", "英")}${addBtn(word)}</div>
    ${senses}
  </div>`;
}

function renderDict(word, hits, form) {
  // cedict.js 每個詞只存第一個釋義，不一定是命中的那個。查 field 卻在
  // 「方面」底下看到 respect 只會誤導，所以對不上就不顯示。
  const relevant = (gloss) => {
    const q = String(form || word).toLowerCase();
    return gloss && gloss.toLowerCase().includes(q) ? gloss : "";
  };
  const senses = hits.map((h) => {
    const g = relevant(h.gloss);
    return `
    <div class="sense">
      <div class="zh zy-line">${renderZhuyin(h.zh, h.z)}</div>
      ${sayBtn(h.zh, "zh-TW", "中")}
      ${g ? `<div class="gloss">${g}</div>` : ""}
    </div>`;
  }).join("");
  return `<div class="card">
    <span class="badge dict">字典</span>
    <div class="headword"><span class="en">${word}</span>${sayBtn(word, "en-US", "英")}${addBtn(word)}</div>
    ${senses}
  </div>`;
}

function renderNotFound(word) {
  return `<div class="state"><span class="big">🔍</span>
    找不到 <b>${word}</b>。<br>檢查一下拼字，或換一個說法試試看。</div>`;
}

// ---------- 最近查過 ----------
const RECENT_KEY = "daisy_dict_recent";
function recent() { try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch (e) { return []; } }
function pushRecent(w) {
  const list = [w, ...recent().filter((x) => x !== w)].slice(0, 12);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch (e) {}
}
function renderRecent() {
  const list = recent();
  if (!list.length) return "";
  return `<h2 class="sec">最近查過</h2><div class="recent">` +
    list.map((w) => `<button class="chip" onclick='go(${attr(w)})'>${w}</button>`).join("") +
    `</div>`;
}

// ---------- 查詢流程 ----------
const out = document.getElementById("out");
const input = document.getElementById("q");
let lastQuery = "";

async function search(raw) {
  const word = String(raw).trim();
  lastQuery = word;
  document.getElementById("clear").classList.toggle("on", !!word);
  if (!word) { out.innerHTML = renderRecent(); return; }

  const mine = resolveWord(word, curriculumLookup);
  let html = mine ? renderCurriculum(mine.form, mine.hit) : "";

  if (!cedictReady) {
    out.innerHTML = html + `<div class="state">查字典中…<div class="loading"></div></div>`;
    await loadCedict();
    if (lastQuery !== word) return;            // 使用者已經改字了
  }

  const found = resolveWord(word, cedictLookup);
  if (found) html += renderDict(found.form, found.hit, found.form);
  if (!html) html = renderNotFound(word);
  else {
    pushRecent(word.toLowerCase());
    // 記下來：這些字會出現在家長儀表板，也會變成遊戲的題庫
    const zh = mine ? mine.hit.s[0].zh : (found ? found.hit[0].zh : "");
    recordLookup(word, zh);
  }

  out.innerHTML = html + renderRecent();
}

function go(w) { input.value = w; search(w); window.scrollTo(0, 0); }

let timer = null;
input.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(() => search(input.value), 220);
});
document.getElementById("clear").addEventListener("click", () => {
  input.value = ""; search(""); input.focus();
});

// ---------- 單字卡清單 ----------
let sheetWord = "";

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("on"), 1600);
}

function addBtn(word) {
  const n = typeof listsContaining === "function" ? listsContaining(word).length : 0;
  return `<button class="add${n ? " on" : ""}" onclick='openSheet(${attr(word)})'>` +
         `${n ? "★ 在 " + n + " 張卡" : "＋ 單字卡"}</button>`;
}

function renderSheetLists() {
  const box = document.getElementById("sheet-lists");
  const lists = getLists();
  if (!lists.length) {
    box.innerHTML = `<div class="sub">還沒有清單，先建一個吧。</div>`;
    return;
  }
  const inIds = listsContaining(sheetWord);
  box.innerHTML = lists.map((l) => {
    const inIt = inIds.includes(l.id);
    return `<div class="row${inIt ? " in" : ""}" onclick='toggleInList(${attr(l.id)})'>
      <b>${l.name}</b><span>${l.words.length} 個字</span>
      <span>${inIt ? "✓ 已加入" : "＋"}</span></div>`;
  }).join("");
}

function openSheet(word) {
  sheetWord = word;
  document.getElementById("sheet-sub").textContent = `把「${word}」放進哪一張單字卡？`;
  renderSheetLists();
  document.getElementById("sheet").classList.add("on");
  document.getElementById("sheet-bg").classList.add("on");
}

function closeSheet() {
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("sheet-bg").classList.remove("on");
  if (lastQuery) search(lastQuery);      // 讓按鈕上的星星狀態更新
}

function toggleInList(id) {
  if (listsContaining(sheetWord).includes(id)) {
    removeFromList(id, sheetWord);
    toast("已從清單移除");
  } else {
    addToList(id, sheetWord);
    toast("加進單字卡了！");
  }
  renderSheetLists();
}

document.getElementById("sheet-close").addEventListener("click", closeSheet);
document.getElementById("sheet-bg").addEventListener("click", closeSheet);
document.getElementById("sheet-add").addEventListener("click", () => {
  const input = document.getElementById("sheet-new");
  const name = input.value.trim();
  if (!name) return input.focus();
  const id = createList(name);
  addToList(id, sheetWord);
  input.value = "";
  renderSheetLists();
  toast("建立「" + name + "」並加入");
});

// ---------- 語音輸入 ----------
// iOS Safari 沒有語音辨識（Web Speech API 只實作了語音合成），所以那邊改成
// 引導她用系統鍵盤上的麥克風。對七歲小孩，用唸的比用打的快得多，
// 而且她本來就在朗讀英文。
function setupVoice() {
  const Recog = window.SpeechRecognition || window.webkitSpeechRecognition;
  const box = document.querySelector(".searchbox");
  const mic = document.getElementById("mic");

  if (!Recog) {
    const tip = document.getElementById("tip");
    if (tip) {
      tip.innerHTML = "文章裡看到不會的字就打進來。" +
        "<br>不想打字的話，用鍵盤上的 🎤 直接唸也可以。";
    }
    return;
  }

  box.classList.add("has-mic");
  const recog = new Recog();
  recog.lang = "en-US";
  recog.interimResults = false;
  recog.maxAlternatives = 1;

  let listening = false;
  const stop = () => { listening = false; mic.classList.remove("listening"); };

  mic.addEventListener("click", () => {
    if (listening) { recog.stop(); return stop(); }
    try { recog.start(); listening = true; mic.classList.add("listening"); }
    catch (e) { stop(); }
  });

  recog.onresult = (e) => {
    const said = (e.results[0][0].transcript || "").trim().replace(/[.,!?]+$/, "");
    if (said) { input.value = said; search(said); }
  };
  recog.onerror = stop;
  recog.onend = stop;
}

setupVoice();

// ?q=word 直接帶入查詢。iOS「捷徑」可以把選取的文字丟到這個網址，
// 是 myON 選不起字時唯一能少按幾下的路。
const initial = new URLSearchParams(location.search).get("q");
if (initial) { input.value = initial; search(initial); }
else out.innerHTML = renderRecent();
loadCedict();                                   // 背景預熱，第一次查就不用等
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
<script src="./menu.js"></script>
</body>
</html>
