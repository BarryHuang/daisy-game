<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" preserveAspectRatio="none">
  <!-- 街道·前景（捲動 1.35）：花台和消防栓會從倉鼠前面掠過。
       一樣是 360 寬的磚，左右邊緣不放東西。 -->
  <g>
    <!-- 花台 -->
    <g transform="translate(46 74)">
      <rect x="0" y="10" width="72" height="36" rx="4" fill="#b98a5e"/>
      <rect x="-4" y="4" width="80" height="10" rx="4" fill="#d0a074"/>
      <g fill="#3f8c55" opacity=".95">
        <ellipse cx="14" cy="2" rx="14" ry="9"/><ellipse cx="36" cy="-2" rx="16" ry="10"/>
        <ellipse cx="58" cy="2" rx="13" ry="8"/>
      </g>
      <g><circle cx="12" cy="-2" r="3.4" fill="#ff8fb0"/><circle cx="34" cy="-7" r="3.4" fill="#ffd166"/>
         <circle cx="56" cy="-2" r="3.4" fill="#c792ea"/></g>
    </g>
    <!-- 消防栓 -->
    <g transform="translate(196 84)">
      <rect x="0" y="8" width="14" height="28" rx="3" fill="#e05252"/>
      <path d="M0 12 a7 7 0 0 1 14 0 z" fill="#c33f3f"/>
      <rect x="-4" y="18" width="22" height="4" rx="2" fill="#c33f3f"/>
      <rect x="-2" y="34" width="18" height="5" rx="2" fill="#a83535"/>
    </g>
    <!-- 另一個花台 -->
    <g transform="translate(272 82)">
      <rect x="0" y="10" width="58" height="32" rx="4" fill="#b98a5e"/>
      <rect x="-4" y="4" width="66" height="9" rx="4" fill="#d0a074"/>
      <g fill="#3f8c55" opacity=".95">
        <ellipse cx="14" cy="2" rx="13" ry="8"/><ellipse cx="40" cy="0" rx="14" ry="9"/>
      </g>
      <g><circle cx="12" cy="-2" r="3" fill="#ffd166"/><circle cx="40" cy="-5" r="3" fill="#ff8fb0"/></g>
    </g>
  </g>
</svg>
