<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CET Week 4 選擇填空</title>
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
<script src="./mastery.js"></script>
<script src="./rewards.js"></script>
<script src="./cloze_quiz.js"></script>
</head>
<body>
<script>
// CET 二上 Wk 4：notice / busy / flour / worried / forgive
//                solve / nod / stealing / month / fair
// 錯誤選項一律取自 二上 CET Wk 1~6 和 FET Wk 1~6（她學過的字），
// 而且盡量挑同詞性的 —— 用沒學過的字當誘答，等於在考運氣不是考單字。
startClozeQuiz({
  title: 'CET Week 4 — 選擇填空',
  subtitle: '二上 · CET Vocabulary ｜ Week 4 ｜ 10 題',
  accent: '#e65100',
  questions: [
    { sentence: 'Did you ___ the new bird in our garden? It is blue and very pretty.',
      answer: 'notice', wrong: ['explain', 'collect'], source: 'CET Wk 4' },

    { sentence: 'Mom is very ___ today. She has a lot of work to do.',
      answer: 'busy', wrong: ['empty', 'bright'], source: 'CET Wk 4' },

    { sentence: 'To make bread, we need ___, water, and salt.',
      answer: 'flour', wrong: ['soil', 'glass'], source: 'CET Wk 4' },

    { sentence: 'Lily is ___ because she cannot find her little dog.',
      answer: 'worried', wrong: ['excited', 'popular'], source: 'CET Wk 4' },

    { sentence: 'I am sorry I broke your toy. Please ___ me.',
      answer: 'forgive', wrong: ['invite', 'admire'], source: 'CET Wk 4' },

    { sentence: 'This math problem is hard, but I think I can ___ it.',
      answer: 'solve', wrong: ['survive', 'produce'], source: 'CET Wk 4' },

    { sentence: 'When you agree with someone, you ___ your head.',
      answer: 'nod', wrong: ['wink', 'crawl'], source: 'CET Wk 4' },

    { sentence: 'The police caught the man ___ money from the shop.',
      answer: 'stealing', wrong: ['climbing', 'pouring'], source: 'CET Wk 4' },

    { sentence: 'January is the first ___ of the year.',
      answer: 'month', wrong: ['holiday', 'meeting'], source: 'CET Wk 4' },

    { sentence: 'Everyone gets the same number of cookies. That is ___.',
      answer: 'fair', wrong: ['strange', 'steep'], source: 'CET Wk 4' },
  ]
});
</script>
<script src="./version.js"></script>
<script src="./menu.js"></script>
</body>
</html>
