<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continents and Oceans — 課文</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--blue:#0E9AC8;--blue-dark:#0A6B8A;--orange:#FF8C42;--bg:#F7FBFD;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);
     color:#1A2B3C;max-width:560px;margin:0 auto;line-height:1.6;padding-bottom:40px;}
/* 左邊留 58px 讓開 menu.js 注入的浮動 ☰ */
.back-link{display:inline-flex;align-items:center;gap:6px;padding:12px 20px 12px 58px;
           font-size:15px;color:var(--blue-dark);font-weight:bold;text-decoration:none}
.hero{background:linear-gradient(135deg,#0E9AC8 0%,#2BB7E2 50%,#A0E7FF 100%);color:#fff;
      padding:22px 20px 20px;border-radius:0 0 24px 24px}
.hero h1{font-size:25px;font-weight:800;line-height:1.2}
.hero .sub{margin-top:6px;font-size:13px;opacity:.95}
.hero .imgwrap{margin-top:14px;border-radius:16px;overflow:hidden;
               box-shadow:0 8px 20px rgba(0,0,0,.2);background:#fff}
.hero .imgwrap img{width:100%;display:block}
.hero .badges{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.hero .badge{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;
             font-size:11px;border:1px solid rgba(255,255,255,.3)}
.tabs{display:flex;gap:8px;padding:14px 16px 0}
.tab{flex:1;padding:9px;border-radius:12px;border:1.5px solid #D0E6EF;background:#fff;
     font-family:inherit;font-size:14px;font-weight:700;color:#5A6D7E;cursor:pointer}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sticky{position:sticky;top:0;z-index:20;background:rgba(247,251,253,.94);
        backdrop-filter:blur(12px);padding:12px 16px;border-bottom:1px solid #E6F0F5}
.searchbox{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid #D0E6EF;
           font-size:15px;outline:none;background:#fff;font-family:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{padding:6px 12px;border-radius:20px;font-size:13px;border:1.5px solid #D0E6EF;
      background:#fff;cursor:pointer;font-family:inherit}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.list{padding:16px;display:flex;flex-direction:column;gap:14px}
.s-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);
        border:1px solid #EAF3F7}
.s-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sid{font-size:12px;color:var(--blue-dark);font-weight:700;background:#E6F6FB;
     padding:2px 8px;border-radius:20px}
.play{padding:4px 9px;border-radius:20px;border:none;background:var(--orange);color:#fff;
      cursor:pointer;font-size:12px;font-family:inherit}
.play.zh{background:#4CAF9C}
.raw{font-size:17px;line-height:1.75;font-weight:500}
.zh{margin-top:8px;font-size:14px;color:#5A6D7E}
.zy{font-size:12px;color:#8A9EAF}
.note{margin-top:8px;font-size:12px;background:#F0F7FF;padding:6px 8px;border-radius:8px;
      color:#2A5A8A;border-left:3px solid var(--blue)}
/* 課文裡的生字做成可以點的藥丸，點了跳出解釋 */
.pill{display:inline-block;background:var(--orange);color:#fff;padding:1px 7px;border-radius:20px;
      font-weight:700;cursor:pointer}
.v-card{background:#fff;border-radius:14px;padding:12px 14px;border:1px solid #EAF3F7;
        display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.v-card .b{font-weight:800;font-size:16px}
.v-card .pos{font-weight:400;color:#8A9EAF;font-size:11px;background:#EEF6F9;
             padding:1px 6px;border-radius:8px;margin-left:4px}
.v-card .meta{font-size:11px;color:#9FB2C2;margin-top:3px}
.v-card .cat{font-size:10px;color:var(--blue-dark);background:#E6F6FB;padding:2px 7px;
             border-radius:20px;align-self:flex-start;white-space:nowrap}
.v-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#overlay{display:none;position:fixed;inset:0;background:rgba(10,40,60,.55);z-index:50;
         align-items:center;justify-content:center;padding:20px}
#overlay.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:400px;
       box-shadow:0 12px 40px rgba(0,0,0,.3)}
.m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.m-b{font-size:26px;font-weight:800}
.m-f{font-size:12px;color:#8A9EAF;margin-top:3px}
.m-ph{font-size:13px;color:#5A6D7E;margin-top:10px;background:#F4FAFC;padding:8px 10px;
      border-radius:10px;line-height:1.7}
.m-zh{font-size:17px;font-weight:700;margin-top:12px}
.m-zy{font-size:12px;color:#8A9EAF}
.m-note{margin-top:12px;font-size:13px;background:#FFF6EE;padding:9px 11px;border-radius:10px;
        color:#8A5A28;border-left:3px solid var(--orange)}
.close{width:100%;margin-top:16px;padding:12px;border:none;border-radius:12px;
       background:var(--blue);color:#fff;font-family:inherit;font-size:15px;
       font-weight:700;cursor:pointer}
.quiz-links{padding:4px 16px 20px;display:flex;flex-direction:column;gap:8px}
.quiz-links a{display:block;padding:13px 15px;border-radius:13px;background:#fff;
              border:1.5px solid #D0E6EF;text-decoration:none;color:#1A2B3C;font-weight:700}
.quiz-links a span{display:block;font-size:12px;color:#8A9EAF;font-weight:400;margin-top:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="./myon_data.js"></script>
</head>
<body>

<a href="daisy_hamster.html" class="back-link">← 返回主頁</a>

<div class="hero">
  <h1>Continents and Oceans</h1>
  <div class="sub">Nancy Kelly Allen ・ Level H ・ 442 words</div>
  <div class="imgwrap"><img src="myon-cover.jpg" alt=""></div>
  <div class="badges">
    <span class="badge">54 句課文</span>
    <span class="badge">76 個單字</span>
    <span class="badge">CET Wk 5・6・7</span>
  </div>
</div>

<div class="tabs">
  <button class="tab on" data-tab="s" type="button">課文 54 句</button>
  <button class="tab" data-tab="v" type="button">單字 76 個</button>
</div>

<div class="sticky">
  <input class="searchbox" id="search" placeholder="搜尋英文、中文或注音…">
  <div class="chips" id="chips"></div>
</div>

<div class="list" id="list"></div>

<div class="quiz-links">
  <a href="daisy_myon_quiz.html">📖 課文理解測驗<span>讀完課文回答 10 題</span></a>
  <a href="daisy_myon_cloze.html">🧩 選擇克漏字<span>整段挖空，從單字庫裡挑</span></a>
  <a href="daisy_myon_dictation.html">🎧 聽寫克漏字<span>聽句子，把缺的字拼出來</span></a>
</div>

<div id="overlay">
  <div class="modal">
    <div class="m-top">
      <div><div class="m-b" id="mB"></div><div class="m-f" id="mF"></div></div>
      <button class="play" id="mPlay" type="button">🔊 EN</button>
    </div>
    <div class="m-ph" id="mPh"></div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="flex:1"><div class="m-zh" id="mZh"></div><div class="m-zy" id="mZy"></div></div>
      <button class="play zh" id="mPlayZh" type="button">🔊 中</button>
    </div>
    <div class="m-note" id="mNote"></div>
    <button class="close" id="mClose" type="button">關閉</button>
  </div>
</div>

<script>
// 這一頁只負責「怎麼顯示」，句子和單字都在 myon_data.js 裡。
// 原本那份是 1900 行手寫的卡片 HTML，改成從資料跑迴圈產生 ——
// 句子要改一個字只要動資料，不用去翻兩千行。
(function () {
  'use strict';
  var S = MYON.sentences, V = MYON.vocab;

  // 查表：原形和課文中的形態都要能查到（divided -> divide）
  var vmap = {};
  V.forEach(function (v) {
    vmap[v.b.toLowerCase()] = v;
    vmap[v.f.toLowerCase()] = v;
  });

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function speak(text, lang) {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang || 'en-US';
      u.rate = 0.9;
      var want = (lang || 'en').slice(0, 2);
      var v = speechSynthesis.getVoices().find(function (x) { return x.lang.indexOf(want) === 0; });
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) { /* 唸不出來就算了，不要擋住閱讀 */ }
  }

  /** 把句子裡的生字包成可以點的藥丸。長的詞組要先配，不然 "feed on" 會被 "feed" 先吃掉 */
  function pillify(raw, ks) {
    var html = esc(raw);
    (ks || []).slice().sort(function (a, b) { return b.length - a.length; }).forEach(function (k) {
      var re = new RegExp('(?<![\\w>-])(' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![\\w<-])', 'i');
      html = html.replace(re, '<span class="pill" data-w="' + esc(k) + '">$1</span>');
    });
    return html;
  }

  function sentenceCard(s) {
    return '<div class="s-card">'
      + '<div class="top"><span class="sid">#' + s.id + '</span><div style="display:flex;gap:8px">'
      +   '<button class="play" type="button" data-en="' + esc(s.raw) + '">🔊 EN</button>'
      +   '<button class="play zh" type="button" data-zh="' + esc(s.zh) + '">🔊 中</button>'
      + '</div></div>'
      + '<div class="raw">' + pillify(s.raw, s.ks) + '</div>'
      + '<div class="zh">' + esc(s.zh) + '</div>'
      + '<div class="zy">' + esc(s.zy) + '</div>'
      + (s.note ? '<div class="note">' + esc(s.note) + '</div>' : '')
      + '</div>';
  }

  function vocabCard(v) {
    return '<div class="v-card" data-w="' + esc(v.b) + '">'
      + '<div><div class="b">' + esc(v.b)
      +   '<span class="pos">' + esc(v.pos || '') + '</span></div>'
      +   '<div class="zh">' + esc(v.zh) + ' <span class="zy">' + esc(v.zy) + '</span></div>'
      +   '<div class="meta">KK ' + esc(v.kk) + '　IPA ' + esc(v.ipa) + '</div></div>'
      + '<div class="v-right"><span class="cat">' + esc(v.c) + '</span>'
      +   '<button class="play" type="button" data-en="' + esc(v.b) + '">🔊</button></div>'
      + '</div>';
  }

  var tab = 's', cat = 'all', q = '';
  var CATS = { all: '全部', geo: '🌍 地理', action: '🏃 動作',
               home: '🏠 住所', body: '🫁 身體', enemy: '🌀 天災' };

  function render() {
    var box = document.getElementById('list');
    var hay, items;
    if (tab === 's') {
      items = S.filter(function (s) {
        return !q || (s.raw + ' ' + s.zh + ' ' + s.zy).toLowerCase().indexOf(q) >= 0;
      });
      box.innerHTML = items.map(sentenceCard).join('')
                   || '<div class="s-card">找不到符合的句子</div>';
    } else {
      items = V.filter(function (v) {
        hay = (v.b + ' ' + v.f + ' ' + v.zh + ' ' + v.zy + ' ' + v.c).toLowerCase();
        return (cat === 'all' || v.c === cat) && (!q || hay.indexOf(q) >= 0);
      });
      box.innerHTML = items.map(vocabCard).join('')
                   || '<div class="v-card">找不到符合的單字</div>';
    }
  }

  function renderChips() {
    // 分類只跟單字有關，看課文的時候藏起來
    var el = document.getElementById('chips');
    el.style.display = tab === 'v' ? '' : 'none';
    el.innerHTML = Object.keys(CATS).map(function (k) {
      return '<button class="chip' + (k === cat ? ' on' : '') + '" type="button" data-c="'
           + k + '">' + CATS[k] + '</button>';
    }).join('');
  }

  function openVocab(word) {
    var v = vmap[String(word).toLowerCase()];
    if (!v) return;
    document.getElementById('mB').textContent = v.b;
    document.getElementById('mF').textContent =
      '課文裡寫作 ' + v.f + '　｜　' + (v.pos || '');
    document.getElementById('mPh').innerHTML =
      'KK ' + esc(v.kk) + '<br>IPA ' + esc(v.ipa);
    document.getElementById('mZh').textContent = v.zh;
    document.getElementById('mZy').textContent = v.zy;
    var note = document.getElementById('mNote');
    note.textContent = v.t ? '💡 ' + v.t : '';
    note.style.display = v.t ? '' : 'none';
    document.getElementById('overlay').classList.add('show');
    document.getElementById('overlay').dataset.w = v.b;
    document.getElementById('overlay').dataset.zh = v.zh;
  }

  // 事件一次綁在 document 上。卡片是重畫的，綁在卡片上每次重畫都要重綁
  document.addEventListener('click', function (e) {
    var t = e.target;
    var play = t.closest('.play');
    if (play && play.dataset.en) { speak(play.dataset.en, 'en-US'); return; }
    if (play && play.dataset.zh) { speak(play.dataset.zh, 'zh-TW'); return; }

    var pill = t.closest('.pill, .v-card');
    if (pill && pill.dataset.w) { openVocab(pill.dataset.w); return; }

    var chip = t.closest('.chip');
    if (chip) { cat = chip.dataset.c; renderChips(); render(); return; }

    var tb = t.closest('.tab');
    if (tb) {
      tab = tb.dataset.tab;
      document.querySelectorAll('.tab').forEach(function (x) {
        x.classList.toggle('on', x === tb);
      });
      renderChips(); render(); return;
    }

    var ov = document.getElementById('overlay');
    if (t.id === 'overlay' || t.id === 'mClose') ov.classList.remove('show');
    if (t.id === 'mPlay') speak(ov.dataset.w, 'en-US');
    if (t.id === 'mPlayZh') speak(ov.dataset.zh, 'zh-TW');
  });

  document.getElementById('search').addEventListener('input', function (e) {
    q = e.target.value.trim().toLowerCase();
    render();
  });

  renderChips();
  render();
  try { speechSynthesis.getVoices(); } catch (e) {}
})();
</script>
<script src="./version.js"></script>
<script src="./menu.js"></script>
</body>
</html>
