<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" preserveAspectRatio="none">
  <!-- 倉鼠的家·前景（捲動 1.35）：抱枕、木箱、盆栽會從倉鼠前面掠過。
       一樣是 360 寬的磚，左右邊緣不放東西。 -->
  <g>
    <!-- 抱枕堆 -->
    <g transform="translate(40 76)">
      <rect x="0" y="6" width="44" height="34" rx="10" fill="#f2a6a0" stroke="#d77f7a" stroke-width="2"/>
      <rect x="26" y="0" width="40" height="32" rx="10" fill="#9fc8f0" stroke="#6f9ac0" stroke-width="2"/>
      <circle cx="22" cy="23" r="3" fill="#fff0f4"/><circle cx="46" cy="16" r="3" fill="#e8f3ff"/>
    </g>
    <!-- 木箱 -->
    <g transform="translate(168 72)">
      <rect x="0" y="4" width="52" height="44" rx="3" fill="#c98c52" stroke="#8a5f36" stroke-width="2.4"/>
      <path d="M0 18h52M0 32h52" stroke="#a8703f" stroke-width="1.8"/>
      <rect x="-3" y="0" width="58" height="8" rx="3" fill="#d9a06a" stroke="#8a5f36" stroke-width="2"/>
    </g>
    <!-- 盆栽 -->
    <g transform="translate(288 60)">
      <path d="M2 34 h34 l-4 26 h-26 z" fill="#d2795c" stroke="#a85a42" stroke-width="2"/>
      <rect x="-2" y="28" width="42" height="9" rx="3" fill="#e0917a" stroke="#a85a42" stroke-width="2"/>
      <g fill="#4aa568">
        <ellipse cx="19" cy="22" rx="18" ry="11"/>
        <ellipse cx="6" cy="14" rx="12" ry="8"/><ellipse cx="32" cy="14" rx="12" ry="8"/>
        <ellipse cx="19" cy="6" rx="11" ry="8"/>
      </g>
      <g fill="#6fc98a" opacity=".7"><ellipse cx="14" cy="10" rx="6" ry="4"/></g>
    </g>
  </g>
</svg>
