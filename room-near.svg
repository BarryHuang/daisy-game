<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" preserveAspectRatio="none">
  <!-- 倉鼠的家·近景（地板與家具，跟著世界 1:1 捲動）。
       前景層會蓋掉畫面最下面約 26%（換算到這張磚大約 y>141），
       所以家具的重點都畫在那條線以上，只有腳和陰影可以掉下去。
       地板和踢腳板橫貫整張圖，要伸出左右邊界。 -->
  <defs>
    <linearGradient id="rnFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0b98a"/><stop offset=".4" stop-color="#cfa473"/>
      <stop offset="1" stop-color="#b48757"/>
    </linearGradient>
    <linearGradient id="rnBed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b6c2"/><stop offset="1" stop-color="#e58aa0"/>
    </linearGradient>
  </defs>

  <!-- 地板 -->
  <rect x="-10" y="118" width="380" height="82" fill="url(#rnFloor)"/>
  <g stroke="#a87c4e" stroke-width="1.6" opacity=".55">
    <path d="M-10 134h380M-10 152h380M-10 172h380"/>
    <path d="M30 118v16M110 118v16M190 118v16M270 118v16M340 118v16"/>
    <path d="M70 134v18M150 134v18M230 134v18M310 134v18"/>
  </g>
  <!-- 踢腳板 -->
  <rect x="-10" y="112" width="380" height="9" rx="2" fill="#c9a377"/>
  <rect x="-10" y="112" width="380" height="3" rx="1.5" fill="#e0bd93"/>

  <!-- 地毯 -->
  <g transform="translate(150 130)">
    <ellipse cx="0" cy="0" rx="56" ry="15" fill="#9fc8f0"/>
    <ellipse cx="0" cy="0" rx="44" ry="11" fill="#c2ddf7"/>
    <ellipse cx="0" cy="0" rx="28" ry="7" fill="#9fc8f0"/>
  </g>

  <!-- 倉鼠的睡窩（藤籃 + 墊子 + 小被子） -->
  <g transform="translate(24 86)">
    <path d="M2 14 h58 l-5 30 h-48 z" fill="#d2a76e" stroke="#a5754a" stroke-width="2"/>
    <g stroke="#b98a58" stroke-width="1.6" opacity=".8">
      <path d="M4 22h54M5 30h52M7 38h48"/>
    </g>
    <path d="M0 10 a31 8 0 0 1 62 0 a31 8 0 0 1 -62 0z" fill="#e0b57c" stroke="#a5754a" stroke-width="2"/>
    <ellipse cx="31" cy="11" rx="25" ry="5.5" fill="url(#rnBed)"/>
    <path d="M10 14 q20 10 44 -1 l2 14 q-24 10 -48 0 z" fill="#f7cdd6"/>
    <circle cx="48" cy="6" r="5" fill="#fff0f4" stroke="#e58aa0" stroke-width="1.4"/>
  </g>

  <!-- 飼料碗 + 水盤 -->
  <g transform="translate(206 120)">
    <path d="M0 0 h30 l-4 14 h-22 z" fill="#8fd0a0" stroke="#4f9f6a" stroke-width="2"/>
    <ellipse cx="15" cy="0" rx="15" ry="4.4" fill="#b6e8c4" stroke="#4f9f6a" stroke-width="2"/>
    <g fill="#c9a06a"><ellipse cx="9" cy="-1" rx="3.4" ry="2.2"/><ellipse cx="17" cy="-2.4" rx="3.4" ry="2.2"/>
       <ellipse cx="22" cy="0" rx="3" ry="2"/></g>
  </g>
  <g transform="translate(244 124)">
    <path d="M0 0 h22 l-3 10 h-16 z" fill="#9fc8f0" stroke="#5a8fc4" stroke-width="2"/>
    <ellipse cx="11" cy="0" rx="11" ry="3.4" fill="#d8ecff" stroke="#5a8fc4" stroke-width="1.8"/>
  </g>

  <!-- 書櫃 -->
  <g transform="translate(276 40)">
    <rect x="0" y="0" width="64" height="82" rx="3" fill="#c79358" stroke="#8a5f37" stroke-width="2.4"/>
    <g fill="#a5754a"><rect x="3" y="26" width="58" height="4"/><rect x="3" y="54" width="58" height="4"/></g>
    <g>
      <rect x="7" y="8" width="7" height="18" rx="1.5" fill="#e0714c"/>
      <rect x="16" y="11" width="6" height="15" rx="1.5" fill="#5fb373"/>
      <rect x="24" y="7" width="8" height="19" rx="1.5" fill="#6f9ac0"/>
      <rect x="34" y="12" width="6" height="14" rx="1.5" fill="#c792ea"/>
      <rect x="43" y="9" width="7" height="17" rx="1.5" fill="#ffd166"/>
      <rect x="7" y="38" width="6" height="16" rx="1.5" fill="#9fc8f0"/>
      <rect x="15" y="34" width="8" height="20" rx="1.5" fill="#f2a6a0"/>
      <rect x="25" y="39" width="6" height="15" rx="1.5" fill="#8fd0a0"/>
    </g>
    <!-- 下層放盆栽和小地球儀 -->
    <g transform="translate(10 60)">
      <path d="M0 8 h14 l-2 14 h-10 z" fill="#d2795c"/>
      <g fill="#4aa568"><ellipse cx="7" cy="4" rx="9" ry="6"/><ellipse cx="2" cy="0" rx="6" ry="4"/>
         <ellipse cx="12" cy="0" rx="6" ry="4"/></g>
    </g>
    <g transform="translate(42 64)"><circle cx="8" cy="9" r="9" fill="#6fc3dd"/>
      <path d="M2 6 q6 3 12 0M3 13 q6 -3 11 1" stroke="#4a9ab5" stroke-width="1.6" fill="none"/>
      <rect x="6" y="18" width="4" height="4" fill="#8a5f37"/></g>
  </g>

  <!-- 玩具箱 -->
  <g transform="translate(120 96)">
    <rect x="0" y="8" width="46" height="28" rx="3" fill="#7fb6df" stroke="#4e7fa8" stroke-width="2"/>
    <rect x="-3" y="2" width="52" height="9" rx="3" fill="#a3d0ef" stroke="#4e7fa8" stroke-width="2"/>
    <circle cx="23" cy="22" r="7" fill="#fff0c2" stroke="#e0b64c" stroke-width="1.8"/>
    <path d="M23 18v8M19 22h8" stroke="#e0b64c" stroke-width="1.8"/>
    <!-- 探出來的球和積木 -->
    <circle cx="8" cy="-2" r="6" fill="#f2a6a0"/>
    <rect x="34" y="-6" width="10" height="10" rx="2" fill="#8fd0a0"/>
  </g>

  <!-- 落地燈 -->
  <g transform="translate(182 56)">
    <rect x="-2" y="14" width="4" height="52" rx="2" fill="#a5754a"/>
    <ellipse cx="0" cy="66" rx="12" ry="4" fill="#8a5f37"/>
    <path d="M-15 14 L15 14 L9 -6 L-9 -6 Z" fill="#ffe8a8" stroke="#e0b64c" stroke-width="2"/>
    <path d="M-15 14 L15 14 L12 18 L-12 18 Z" fill="#ffd166" opacity=".6"/>
  </g>
</svg>
