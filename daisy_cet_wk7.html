<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CET Week 7 選擇填空</title>
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
<script src="./mastery.js"></script>
<script src="./rewards.js"></script>
<script src="./cloze_quiz.js"></script>
</head>
<body>
<script>
// CET 二上 Wk 7：bottom / strong / wave / hurricane / cause
//                storm / grow / damage / freeze / thick
//
// 句子有兩個來源，優先用課本原句（Continents and Oceans, Nancy Kelly Allen,
// Rubicon Publishing, Level H）—— 她在課堂上讀過的句子，複習時認得出來。
//
// 原句不能用的時候改用 words.js 裡 wordExamples 的例句，那也是她在複習
// 卡片上看過的句子，而且一個字一句、彼此不會提到對方的答案。
//
// 為什麼需要第二個來源：整篇課文裡 strong 和 wave 只出現在「Strong winds
// cause high waves.」這一句。原本三題（strong、wave、cause）都挖這一句的
// 不同空格，十題裡三題長一樣 —— 她自己寫到第三次就發現了。
// 課文的句子彼此也一定會提到對方的字（「Hurricanes can cause floods and
// damage buildings.」一句就洩漏了 hurricane 和 cause 兩題的答案）。
startClozeQuiz({
  title: 'CET Week 7 — 選擇填空',
  subtitle: '二上 · CET Vocabulary ｜ Week 7 ｜ 10 題',
  accent: '#5d4037',
  questions: [
    { sentence: 'The ___ of the ocean is called the ocean floor.',
      answer: 'bottom', wrong: ['surface', 'feature'], source: 'CET Wk 7' },

    { sentence: 'The wind was so ___ that we could not open the door.',
      answer: 'strong', wrong: ['thick', 'shallow'], source: 'CET Wk 7' },

    { sentence: 'We watched the big ___ hit the rocks at the coast.',
      answer: 'waves', lemma: 'wave', wrong: ['floods', 'rivers'], source: 'CET Wk 7' },

    { sentence: 'A ___ blew the roof away.',
      answer: 'hurricane', wrong: ['island', 'canyon'], source: 'CET Wk 7' },

    // cause 的單字卡例句是「Storms cause big waves.」，裡面同時有 storm（Q6）
    // 和 waves（Q3）兩個答案，換過去只是換個洞洩漏，所以這題自己寫一句。
    { sentence: 'Heavy rain can ___ a flood.',
      answer: 'cause', wrong: ['survive', 'divide'], source: 'CET Wk 7' },

    { sentence: 'A big ___ is coming.',
      answer: 'storm', wrong: ['island', 'valley'], source: 'CET Wk 7' },

    { sentence: 'Giant kelp can ___ up to two feet per day.',
      answer: 'grow', wrong: ['flow', 'freeze'], source: 'CET Wk 7' },

    { sentence: 'The flood will ___ the town.',
      answer: 'damage', wrong: ['produce', 'collect'], source: 'CET Wk 7' },

    { sentence: 'Cold temperatures ___ the water.',
      answer: 'freeze', wrong: ['breathe', 'divide'], source: 'CET Wk 7' },

    { sentence: 'Some Arctic ice sheets are 15 feet ___.',
      answer: 'thick', wrong: ['salty', 'popular'], source: 'CET Wk 7' },

  ]
});
</script>
<script src="./version.js"></script>
<script src="./menu.js"></script>
</body>
</html>
