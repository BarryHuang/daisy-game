<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" preserveAspectRatio="none">
  <!-- 遊戲中心·近景（地毯與獎品櫃，1:1 捲動）。
       前景層會蓋掉畫面最下面約 26%（磚上大約 y>141），重點都畫在那條線以上。 -->
  <defs>
    <linearGradient id="anRug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3b7d"/><stop offset=".45" stop-color="#3a2e63"/>
      <stop offset="1" stop-color="#2a2149"/>
    </linearGradient>
  </defs>

  <!-- 獎品櫃 -->
  <g transform="translate(250 54)">
    <rect x="0" y="0" width="74" height="64" rx="4" fill="#33285c" stroke="#6be7ff" stroke-width="2.4"/>
    <g fill="#2a2149"><rect x="4" y="20" width="66" height="3.4"/><rect x="4" y="42" width="66" height="3.4"/></g>
    <g>
      <circle cx="16" cy="13" r="6" fill="#ff8fb0"/><circle cx="34" cy="13" r="6" fill="#ffd166"/>
      <circle cx="52" cy="13" r="6" fill="#8fd0a0"/>
      <rect x="10" y="28" width="13" height="12" rx="2" fill="#6be7ff"/>
      <rect x="29" y="28" width="13" height="12" rx="2" fill="#ff6bd6"/>
      <rect x="48" y="28" width="13" height="12" rx="2" fill="#ffd166"/>
      <circle cx="20" cy="54" r="7" fill="#c792ea"/><circle cx="42" cy="54" r="7" fill="#9fc8f0"/>
    </g>
  </g>

  <!-- 地毯 -->
  <rect x="-10" y="118" width="380" height="82" fill="url(#anRug)"/>
  <rect x="-10" y="112" width="380" height="9" rx="2" fill="#241d40"/>
  <rect x="-10" y="112" width="380" height="3" rx="1.5" fill="#6be7ff" opacity=".7"/>
  <!-- 地毯上的星星和幾何紋 -->
  <g fill="#6b58ab" opacity=".55">
    <path d="M40 132 l2.4 5 5.6 .8 -4 3.9 .9 5.5 -4.9 -2.6 -4.9 2.6 .9 -5.5 -4 -3.9 5.6 -.8 z"/>
    <path d="M180 138 l2.4 5 5.6 .8 -4 3.9 .9 5.5 -4.9 -2.6 -4.9 2.6 .9 -5.5 -4 -3.9 5.6 -.8 z"/>
    <path d="M300 130 l2.4 5 5.6 .8 -4 3.9 .9 5.5 -4.9 -2.6 -4.9 2.6 .9 -5.5 -4 -3.9 5.6 -.8 z"/>
  </g>
  <g stroke="#6b58ab" stroke-width="2" opacity=".4" fill="none">
    <circle cx="110" cy="146" r="13"/><circle cx="244" cy="150" r="11"/>
  </g>
</svg>
