<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" preserveAspectRatio="none">
  <!-- 街道·遠景（捲動 0.25）：遠處的房子天際線。
       左右邊緣不放建築（留 10px 空白），平鋪時不會被接縫切一半。 -->
  <defs>
    <linearGradient id="stFarW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dff0"/><stop offset="1" stop-color="#b3bdd8"/>
    </linearGradient>
    <linearGradient id="stFarR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a38ab5"/><stop offset="1" stop-color="#7f6894"/>
    </linearGradient>
  </defs>

  <g fill="url(#stFarW)">
    <rect x="14" y="66" width="46" height="120" rx="3"/>
    <rect x="74" y="88" width="34" height="98" rx="3"/>
    <rect x="124" y="54" width="52" height="132" rx="3"/>
    <rect x="192" y="82" width="38" height="104" rx="3"/>
    <rect x="246" y="62" width="48" height="124" rx="3"/>
    <rect x="308" y="90" width="38" height="96" rx="3"/>
  </g>
  <g fill="url(#stFarR)">
    <path d="M10 68 L37 48 L64 68 Z"/>
    <path d="M70 90 L91 76 L112 90 Z"/>
    <path d="M120 56 L150 34 L180 56 Z"/>
    <path d="M188 84 L211 70 L234 84 Z"/>
    <path d="M242 64 L270 44 L298 64 Z"/>
    <path d="M304 92 L327 78 L350 92 Z"/>
  </g>
  <!-- 窗戶：只用色塊，遠景不需要框 -->
  <g fill="#8e9ab8" opacity=".75">
    <rect x="22" y="80" width="9" height="11" rx="1.5"/><rect x="36" y="80" width="9" height="11" rx="1.5"/>
    <rect x="22" y="100" width="9" height="11" rx="1.5"/><rect x="36" y="100" width="9" height="11" rx="1.5"/>
    <rect x="82" y="100" width="8" height="10" rx="1.5"/><rect x="94" y="100" width="8" height="10" rx="1.5"/>
    <rect x="134" y="70" width="10" height="12" rx="1.5"/><rect x="150" y="70" width="10" height="12" rx="1.5"/>
    <rect x="134" y="92" width="10" height="12" rx="1.5"/><rect x="150" y="92" width="10" height="12" rx="1.5"/>
    <rect x="200" y="96" width="9" height="11" rx="1.5"/><rect x="213" y="96" width="9" height="11" rx="1.5"/>
    <rect x="256" y="76" width="9" height="11" rx="1.5"/><rect x="270" y="76" width="9" height="11" rx="1.5"/>
    <rect x="256" y="98" width="9" height="11" rx="1.5"/><rect x="270" y="98" width="9" height="11" rx="1.5"/>
    <rect x="316" y="104" width="8" height="10" rx="1.5"/><rect x="329" y="104" width="8" height="10" rx="1.5"/>
  </g>
  <!-- 遠處的樹，讓天際線不要只有方塊 -->
  <g fill="#9cc4a8" opacity=".9">
    <ellipse cx="112" cy="150" rx="14" ry="18"/><ellipse cx="236" cy="152" rx="13" ry="16"/>
  </g>
</svg>
