<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家長觀察後台 👨‍👩‍👧</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        header h1 {
            color: white;
            font-size: 1.5rem;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.4);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.35); }

        /* 使用者選擇 */
        .user-select-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .user-select-card label { font-weight: bold; color: #555; }
        #user-select {
            flex: 1;
            min-width: 140px;
            padding: 8px 12px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 1rem;
        }
        .load-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* 卡片 */
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card h2 {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 數字統計格 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }
        .stat-item {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }
        .stat-num {
            font-size: 2rem;
            font-weight: bold;
            color: #764ba2;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }

        /* 不熟單字清單 */
        .word-chip {
            display: inline-block;
            background: #fff3e0;
            border: 2px solid #f39c12;
            color: #d35400;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            margin: 4px;
            text-transform: uppercase;
        }
        .word-chip.empty {
            background: #e8f8f5;
            border-color: #2ecc71;
            color: #27ae60;
        }

        /* 進度條（快樂/飽食/潔淨） */
        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .bar-label { width: 60px; font-size: 0.85rem; color: #555; }
        .bar-bg {
            flex: 1;
            background: #eee;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s;
        }
        .bar-val { width: 36px; text-align: right; font-size: 0.85rem; color: #888; }

        /* 成就 */
        .ach-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .ach-item:last-child { border-bottom: none; }
        .ach-icon { font-size: 1.8rem; filter: grayscale(1); }
        .ach-icon.unlocked { filter: none; }
        .ach-name { font-weight: bold; font-size: 0.9rem; color: #888; }
        .ach-name.unlocked { color: #d35400; }
        .ach-desc { font-size: 0.8rem; color: #aaa; }

        /* 任務 */
        .quest-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .quest-item:last-child { border-bottom: none; }
        .quest-text { font-size: 0.9rem; color: #555; }
        .quest-badge {
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: bold;
        }
        .quest-badge.done { background: #d5f5e3; color: #27ae60; }
        .quest-badge.todo { background: #fdebd0; color: #e67e22; }

        .loading { text-align: center; color: white; padding: 40px; font-size: 1.2rem; }
        #dashboard { display: none; }

        /* 所有使用者列表 */
        .users-table {
            width: 100%;
            border-collapse: collapse;
        }
        .users-table th {
            background: #f0f0f0;
            padding: 10px 14px;
            text-align: left;
            font-size: 0.85rem;
            color: #666;
            cursor: pointer;
            user-select: none;
        }
        .users-table th:hover { background: #e0e0e0; }
        .users-table td {
            padding: 11px 14px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 0.95rem;
        }
        .users-table tr:last-child td { border-bottom: none; }
        .users-table tr:hover td { background: #fafafa; }
        .users-table .user-link {
            color: #667eea;
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }
        .users-table .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-level { background: #ede7f6; color: #6c5ce7; }
        .badge-coins { background: #fff8e1; color: #f39c12; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>👨‍👩‍👧 家長學習後台</h1>
        <a href="daisy_hamster.html" class="back-btn">← 回到遊戲</a>
    </header>

    <!-- 所有使用者列表 -->
    <div class="card" id="all-users-card" style="margin-bottom:20px;">
        <h2 style="font-size:1.1rem; color:#555; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;">
            <span>👥 所有玩家</span>
            <span id="all-users-count" style="font-size:0.8rem; color:#aaa;"></span>
        </h2>
        <div id="all-users-loading" style="color:#aaa; font-size:0.9rem;">⏳ 載入中...</div>
        <table class="users-table" id="users-table" style="display:none;">
            <thead>
                <tr>
                    <th onclick="sortUsers('name')">🆔 帳號</th>
                    <th onclick="sortUsers('level')">🌟 等級</th>
                    <th onclick="sortUsers('coins')">💰 金幣</th>
                    <th onclick="sortUsers('combo')">🔥 最高 Combo</th>
                    <th onclick="sortUsers('words')">✅ 通關字數</th>
                </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
        </table>
    </div>

    <!-- 帳號選擇 -->
    <div class="user-select-card">
        <label>📋 查看帳號：</label>
        <input type="text" id="user-input" placeholder="輸入帳號（如 DAISY）"
               style="flex:1; min-width:140px; padding:8px 12px; border-radius:10px; border:2px solid #ddd; font-size:1rem; text-transform:uppercase;"
               value="DAISY">
        <button class="load-btn" onclick="loadUserData()">🔍 查詢</button>
    </div>

    <div id="loading-msg" class="loading" style="display:none;">⏳ 載入資料中...</div>

    <div id="dashboard">
        <!-- 基本資訊 -->
        <div class="card">
            <h2>🐹 倉鼠狀態</h2>
            <div class="stats-grid" id="stats-grid"></div>
        </div>

        <!-- 倉鼠健康 -->
        <div class="card">
            <h2>💓 寵物狀況</h2>
            <div id="pet-bars"></div>
        </div>

        <!-- 今日任務 -->
        <div class="card">
            <h2>📜 今日任務</h2>
            <div id="quest-info"></div>
        </div>

        <!-- 不熟單字 -->
        <div class="card">
            <h2>📚 複習單字清單</h2>
            <p style="font-size:0.85rem; color:#aaa; margin-bottom:12px;">以下是 Daisy 曾猜錯或用過提示鍵的單字，系統正在加強出題。</p>
            <div id="mistake-words"></div>
        </div>

        <!-- 成就 -->
        <div class="card">
            <h2>🎯 還沒學會的字</h2>
            <p style="font-size:0.85rem;color:#999;margin-bottom:10px;">
                從遊戲的作答紀錄算出來。連續三次乾淨答對就算學會，不再列出。</p>
            <div id="weak-words">—</div>
        </div>

        <div class="card">
            <h2>📖 她自己查過的字</h2>
            <p style="font-size:0.85rem;color:#999;margin-bottom:10px;">
                在字典查過的單字，最近的排前面。查很多次的通常是還沒記起來的。</p>
            <div id="lookup-words">—</div>
        </div>

        <div class="card">
            <h2>🏆 成就解鎖</h2>
            <div id="achievement-list"></div>
        </div>
    </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="./firebase-config.js"></script>
<script src="./words.js"></script>
<script>
    const firebaseConfig = FIREBASE_CONFIG;   // 見 firebase-config.js
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function loadUserData() {
        const code = document.getElementById('user-input').value.trim().toUpperCase();
        if (!code) { alert('請輸入帳號！'); return; }

        document.getElementById('loading-msg').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';

        loadLookups(code);
        loadWeakWords(code);
        db.ref('users/' + code + '/petData').once('value', snap => {
            document.getElementById('loading-msg').style.display = 'none';
            const d = snap.val();
            if (!d) { alert(`找不到帳號「${code}」的資料，請確認帳號名稱正確！`); return; }
            renderDashboard(d);
            document.getElementById('dashboard').style.display = 'block';
        });
    }

    function loadWeakWords(code) {
        const box = document.getElementById('weak-words');
        box.innerHTML = '<span style="color:#aaa;font-size:0.9rem;">⏳ 載入中...</span>';
        db.ref('users/' + code + '/mastery').once('value', snap => {
            const val = snap.val() || {};
            const day = 86400000, now = Date.now();
            const rows = Object.entries(val)
                .map(([w, m]) => ({ w, r: m.r || 0, x: m.w || 0, s: m.s || 0, t: m.t || 0 }))
                .filter(r => r.s < 3)
                .map(r => {
                    const rate = r.x / Math.max(1, r.x + r.r);
                    const stale = Math.min(30, (now - (r.t || now)) / day) / 30;
                    return Object.assign(r, { score: rate * 3 + stale });
                })
                .sort((a, b) => b.score - a.score);

            const done = Object.values(val).filter(m => (m.s || 0) >= 3).length;
            if (!rows.length) {
                box.innerHTML = '<span style="color:#aaa;font-size:0.9rem;">' +
                    (done ? '目前列出的字都學會了 🎉' : '還沒有作答紀錄。') + '</span>';
                return;
            }

            const ago = t => {
                if (!t) return '';
                const d = Math.floor((now - t) / day);
                return d <= 0 ? '今天' : d === 1 ? '昨天' : d + ' 天前';
            };

            box.innerHTML =
                '<div style="font-size:0.85rem;color:#888;margin-bottom:8px;">' +
                rows.length + ' 個還在練，已學會 ' + done + ' 個</div>' +
                rows.slice(0, 40).map(r => {
                    const hot = r.x > r.r;
                    return '<div style="display:flex;align-items:baseline;gap:8px;padding:7px 0;' +
                    'border-top:1px solid #f0f0f0;flex-wrap:wrap;">' +
                    '<b style="min-width:110px;' + (hot ? 'color:#c2410c;' : '') + '">' + r.w + '</b>' +
                    '<span style="flex:1;color:#555;font-size:0.9rem;">' +
                      (typeof wordTranslations !== 'undefined' ? (wordTranslations[r.w] || '') : '') + '</span>' +
                    '<span style="background:' + (hot ? '#fdece3' : '#eef1fd') + ';color:' +
                      (hot ? '#c2410c' : '#4459a8') + ';border-radius:99px;padding:2px 8px;' +
                      'font-size:0.75rem;font-weight:bold;">對 ' + r.r + ' 錯 ' + r.x + '</span>' +
                    '<span style="color:#bbb;font-size:0.75rem;">' + ago(r.t) + '</span>' +
                    '</div>';
                }).join('');
        }, () => {
            box.innerHTML = '<span style="color:#c66;font-size:0.9rem;">讀取失敗。</span>';
        });
    }

    function loadLookups(code) {
        const box = document.getElementById('lookup-words');
        box.innerHTML = '<span style="color:#aaa;font-size:0.9rem;">⏳ 載入中...</span>';
        db.ref('users/' + code + '/lookups').once('value', snap => {
            const val = snap.val() || {};
            const list = Object.entries(val)
                .map(([w, v]) => ({ w, n: (v && v.n) || 1, t: (v && v.t) || 0, zh: (v && v.zh) || '' }))
                .sort((a, b) => b.t - a.t);

            if (!list.length) {
                box.innerHTML = '<span style="color:#aaa;font-size:0.9rem;">還沒有查過任何單字。</span>';
                return;
            }

            const day = 86400000;
            const ago = t => {
                if (!t) return '';
                const d = Math.floor((Date.now() - t) / day);
                return d <= 0 ? '今天' : d === 1 ? '昨天' : d + ' 天前';
            };

            box.innerHTML =
                '<div style="font-size:0.85rem;color:#888;margin-bottom:8px;">共 ' +
                list.length + ' 個字</div>' +
                list.slice(0, 60).map(x =>
                    '<div style="display:flex;align-items:baseline;gap:8px;padding:7px 0;' +
                    'border-top:1px solid #f0f0f0;flex-wrap:wrap;">' +
                    '<b style="min-width:120px;">' + x.w + '</b>' +
                    '<span style="flex:1;color:#555;">' + (x.zh || '') + '</span>' +
                    (x.n > 1 ? '<span style="background:#fff4dc;color:#a86a00;border-radius:99px;' +
                               'padding:2px 8px;font-size:0.75rem;font-weight:bold;">查過 ' +
                               x.n + ' 次</span>' : '') +
                    '<span style="color:#bbb;font-size:0.75rem;">' + ago(x.t) + '</span>' +
                    '</div>').join('');
        }, () => {
            box.innerHTML = '<span style="color:#c66;font-size:0.9rem;">讀取失敗。</span>';
        });
    }

    function renderDashboard(d) {
        // 1. 基本統計
        const statsGrid = document.getElementById('stats-grid');
        const items = [
            { num: d.level || 1, label: '🌟 等級' },
            { num: d.coins || 0, label: '💰 金幣' },
            { num: d.totalWordsCleared || 0, label: '✅ 通關單字數' },
            { num: (d.stats && d.stats.maxCombo) || 0, label: '🔥 最高 Combo' },
            { num: d.loginStreak || 0, label: '📅 連續登入天數' },
        ];
        statsGrid.innerHTML = items.map(i => `
            <div class="stat-item">
                <div class="stat-num">${i.num}</div>
                <div class="stat-label">${i.label}</div>
            </div>
        `).join('');

        // 2. 寵物狀況
        const bars = [
            { label: '😊 快樂', val: d.happiness || 0, color: '#ff6b81' },
            { label: '🍎 飽食', val: d.hunger || 0, color: '#f39c12' },
            { label: '🪥 潔淨', val: d.cleanliness || 0, color: '#3498db' },
        ];
        document.getElementById('pet-bars').innerHTML = bars.map(b => `
            <div class="bar-row">
                <span class="bar-label">${b.label}</span>
                <div class="bar-bg">
                    <div class="bar-fill" style="width:${b.val}%; background:${b.color};"></div>
                </div>
                <span class="bar-val">${b.val}%</span>
            </div>
        `).join('');

        // 3. 每日任務
        const questDiv = document.getElementById('quest-info');
        if (d.quests && d.quests.list) {
            questDiv.innerHTML = `<p style="font-size:0.8rem;color:#aaa;margin-bottom:8px;">日期：${d.quests.date}</p>` +
                d.quests.list.map(q => `
                    <div class="quest-item">
                        <div>
                            <div class="quest-text">${q.text}</div>
                            <div style="font-size:0.75rem;color:#aaa;">進度: ${q.current} / ${q.target}</div>
                        </div>
                        <span class="quest-badge ${q.done ? 'done' : 'todo'}">${q.done ? '✅ 完成' : '⏳ 進行中'}</span>
                    </div>
                `).join('');
        } else {
            questDiv.innerHTML = '<p style="color:#aaa;font-size:0.9rem;">今天還沒有任務資料。</p>';
        }

        // 4. 不熟單字
        const mistakeWordsDiv = document.getElementById('mistake-words');
        const mw = (d.stats && d.stats.mistakeWords) ? d.stats.mistakeWords : [];
        if (mw.length > 0) {
            mistakeWordsDiv.innerHTML = mw.map(w =>
                `<span class="word-chip">${w}</span>`
            ).join('');
        } else {
            mistakeWordsDiv.innerHTML = '<span class="word-chip empty">🎉 目前沒有需要複習的單字！</span>';
        }

        // 5. 成就
        const achs = [
            { key: 'combo30', icon: '🔥', name: 'Combo 大師', desc: '連續拼對 30 題' },
            { key: 'richer', icon: '💰', name: '倉鼠大富翁', desc: '金幣累積達 1000 枚' },
            { key: 'level10', icon: '👑', name: '頂級飼養員', desc: '倉鼠達到 Level 10' },
        ];
        const achDiv = document.getElementById('achievement-list');
        achDiv.innerHTML = achs.map(a => {
            const unlocked = d.achievements && d.achievements[a.key];
            return `<div class="ach-item">
                <div class="ach-icon ${unlocked ? 'unlocked' : ''}">${a.icon}</div>
                <div>
                    <div class="ach-name ${unlocked ? 'unlocked' : ''}">${a.name} ${unlocked ? '✅' : '🔒 未解鎖'}</div>
                    <div class="ach-desc">${a.desc}</div>
                </div>
            </div>`;
        }).join('');
    }

    // 自動讀取預設帳號
    window.onload = () => {
        loadAllUsers();
        loadUserData();
    };

    // ======= 所有玩家列表 =======
    let allUsersData = [];
    let currentSort = { key: 'name', asc: true };

    function loadAllUsers() {
        db.ref('users').once('value', snap => {
            const data = snap.val();
            if (!data) { document.getElementById('all-users-loading').textContent = '無資料'; return; }

            allUsersData = Object.entries(data).map(([name, val]) => {
                const p = (val && val.petData) || {};
                return {
                    name,
                    level: p.level || 1,
                    coins: p.coins || 0,
                    combo: (p.stats && p.stats.maxCombo) || 0,
                    words: p.totalWordsCleared || 0,
                };
            });

            document.getElementById('all-users-count').textContent = `${allUsersData.length} 位玩家`;
            document.getElementById('all-users-loading').style.display = 'none';
            document.getElementById('users-table').style.display = 'table';
            renderUsersTable();
        });
    }

    function sortUsers(key) {
        if (currentSort.key === key) currentSort.asc = !currentSort.asc;
        else { currentSort.key = key; currentSort.asc = key === 'name'; }
        renderUsersTable();
    }

    function renderUsersTable() {
        const { key, asc } = currentSort;
        const sorted = [...allUsersData].sort((a, b) => {
            if (typeof a[key] === 'string') return asc ? a[key].localeCompare(b[key]) : b[key].localeCompare(a[key]);
            return asc ? a[key] - b[key] : b[key] - a[key];
        });

        document.getElementById('users-tbody').innerHTML = sorted.map(u => `
            <tr>
                <td><span class="user-link" onclick="jumpToUser('${u.name}')">${u.name}</span></td>
                <td><span class="badge badge-level">${u.level}</span></td>
                <td><span class="badge badge-coins">${u.coins}</span></td>
                <td>${u.combo}</td>
                <td>${u.words}</td>
            </tr>
        `).join('');
    }

    function jumpToUser(name) {
        document.getElementById('user-input').value = name;
        loadUserData();
        window.scrollTo({ top: document.getElementById('dashboard').offsetTop, behavior: 'smooth' });
    }
</script>
<script src="./version.js"></script>
<script src="./menu.js"></script>
</body>
</html>
