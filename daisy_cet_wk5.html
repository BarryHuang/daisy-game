<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CET Week 5 選擇填空</title>
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
<script src="./mastery.js"></script>
<script src="./rewards.js"></script>
<script src="./cloze_quiz.js"></script>
</head>
<body>
<script>
// CET 二上 Wk 5：planet / surface / space / divide / piece
//                continent / natural / feature / landform / valley
//
// 句子盡量取自課本原句（Continents and Oceans, Nancy Kelly Allen,
// Rubicon Publishing, Level H）—— 她在課堂上讀過的句子，複習時認得出來。
//
// natural 例外：課文裡 natural 和 feature 只同時出現在「Landforms are
// natural features on Earth.」這一句，兩題挖同一句的不同空格會長得一模一樣
// （Wk 7 踩過同樣的坑）。feature 留原句，natural 改成自己寫的句子。
startClozeQuiz({
  title: 'CET Week 5 — 選擇填空',
  subtitle: '二上 · CET Vocabulary ｜ Week 5 ｜ 10 題',
  accent: '#1565c0',
  questions: [
    { sentence: 'Earth is sometimes called the blue ___.',
      answer: 'planet', wrong: ['continent', 'island'], source: 'CET Wk 5' },

    { sentence: 'Almost three-quarters of Earth\'s ___ is water.',
      answer: 'surface', wrong: ['feature', 'piece'], source: 'CET Wk 5' },

    { sentence: 'From ___, the water looks blue.',
      answer: 'space', wrong: ['daylight', 'shadow'], source: 'CET Wk 5' },

    { sentence: 'All land on Earth is ___ into seven large pieces.',
      answer: 'divided', lemma: 'divide', wrong: ['collected', 'invited'], source: 'CET Wk 5' },

    { sentence: 'These ___ are called continents.',
      answer: 'pieces', lemma: 'piece', wrong: ['features', 'valleys'], source: 'CET Wk 5' },

    { sentence: 'An island is smaller than a ___.',
      answer: 'continent', wrong: ['valley', 'landform'], source: 'CET Wk 5' },

    { sentence: 'A canyon is not built by people. It is ___.',
      answer: 'natural', wrong: ['popular', 'strange'], source: 'CET Wk 5' },

    { sentence: 'Landforms are natural ___ on Earth.',
      answer: 'features', lemma: 'feature', wrong: ['pieces', 'planets'], source: 'CET Wk 5' },

    { sentence: 'A valley is another ___.',
      answer: 'landform', wrong: ['continent', 'feature'], source: 'CET Wk 5' },

    { sentence: 'A canyon is a very deep ___.',
      answer: 'valley', wrong: ['island', 'piece'], source: 'CET Wk 5' },

  ]
});
</script>
<script src="./version.js"></script>
<script src="./menu.js"></script>
</body>
</html>
