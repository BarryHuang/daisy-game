<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CET Week 5 選擇填空</title>
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
<script src="./mastery.js"></script>
<script src="./rewards.js"></script>
<script src="./cloze_quiz.js"></script>
</head>
<body>
<script>
// CET 二上 Wk 5：planet / surface / space / divide / piece
//                continent / natural / feature / landform / valley
// 這一週整組都是地理和太空的字，意思彼此很接近，所以誘答刻意也挑
// 同一類的（island、valley、desert…）—— 她得真的讀懂句子才選得出來。
startClozeQuiz({
  title: 'CET Week 5 — 選擇填空',
  subtitle: '二上 · CET Vocabulary ｜ Week 5 ｜ 10 題',
  accent: '#1565c0',
  questions: [
    { sentence: 'Earth is the ___ we live on.',
      answer: 'planet', wrong: ['island', 'valley'], source: 'CET Wk 5' },

    { sentence: 'The ___ of the lake is smooth, like a mirror.',
      answer: 'surface', wrong: ['shadow', 'scent'], source: 'CET Wk 5' },

    { sentence: 'Astronauts fly into ___ to look at the stars.',
      answer: 'space', wrong: ['daylight', 'soil'], source: 'CET Wk 5' },

    { sentence: 'Let us ___ the cake into four pieces, one for each of us.',
      answer: 'divide', wrong: ['collect', 'admire'], source: 'CET Wk 5' },

    { sentence: 'Can I have a ___ of your chocolate?',
      answer: 'piece', wrong: ['booth', 'snapshot'], source: 'CET Wk 5' },

    { sentence: 'Asia is the biggest ___ in the world.',
      answer: 'continent', wrong: ['island', 'valley'], source: 'CET Wk 5' },

    { sentence: 'A rainbow is ___. People do not make it.',
      answer: 'natural', wrong: ['busy', 'salty'], source: 'CET Wk 5' },

    { sentence: 'A long nose is a special ___ of an elephant.',
      answer: 'feature', wrong: ['pleasure', 'meeting'], source: 'CET Wk 5' },

    { sentence: 'A mountain is one kind of ___, and a river is another kind.',
      answer: 'landform', wrong: ['creature', 'souvenir'], source: 'CET Wk 5' },

    { sentence: 'The river runs through the ___ between the two mountains.',
      answer: 'valley', wrong: ['desert', 'backyard'], source: 'CET Wk 5' },
  ]
});
</script>
<script src="./version.js"></script>
<script src="./menu.js"></script>
</body>
</html>
