<?xml version="1.0" encoding="UTF-8"?>
<!-- 從 daisy_hamster.html 抽出來的倉鼠（同一隻），v2 用 <img> 引用。改長相兩邊要一起改。 -->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- 倉鼠。座標刻意沿用舊版（頭心 50,45／身體 50,65／胸口 y70／頭頂 y20），
         因為帽子和蝴蝶結是 JS 用固定座標塞進 #hamster-hat / #hamster-bow 的。
         舊版是幾個純色橢圓，所以看起來很平；這版加了漸層打光、暖色描邊、
         毛絨邊緣和五官細節。class 全部保留（.eye/.eye-closed/.mouth/.arm-*）。 -->
    <defs>
        <radialGradient id="hmBody" cx=".38" cy=".3" r=".85">
            <stop offset="0" stop-color="#f7c98f"/>
            <stop offset=".55" stop-color="#e8a765"/>
            <stop offset="1" stop-color="#cd8748"/>
        </radialGradient>
        <radialGradient id="hmHead" cx=".38" cy=".28" r=".8">
            <stop offset="0" stop-color="#ffe0b4"/>
            <stop offset=".6" stop-color="#f3c189"/>
            <stop offset="1" stop-color="#dda264"/>
        </radialGradient>
        <radialGradient id="hmBelly" cx=".5" cy=".35" r=".7">
            <stop offset="0" stop-color="#fff2dc"/>
            <stop offset="1" stop-color="#fbdcb4"/>
        </radialGradient>
        <radialGradient id="hmEar" cx=".5" cy=".4" r=".7">
            <stop offset="0" stop-color="#f9b6c7"/><stop offset="1" stop-color="#e58aa2"/>
        </radialGradient>
        <linearGradient id="hmPaw" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fcc7d2"/><stop offset="1" stop-color="#f0a0b4"/>
        </linearGradient>
    </defs>

    <g stroke="#b5763c" stroke-linecap="round" stroke-linejoin="round">
        <!-- 尾巴 -->
        <path d="M82 80 q10 2 9 -7 q-1 -6 -7 -5" fill="#e8a765" stroke-width="2"/>

        <!-- 耳朵（在頭後面） -->
        <g stroke-width="2">
            <g class="ear l">
                <circle cx="33" cy="24" r="11" fill="#e8a765"/>
                <circle cx="33" cy="25" r="6" fill="url(#hmEar)" stroke="none"/>
            </g>
            <g class="ear r">
                <circle cx="67" cy="24" r="11" fill="#e8a765"/>
                <circle cx="67" cy="25" r="6" fill="url(#hmEar)" stroke="none"/>
            </g>
        </g>

        <!-- 身體。毛絨邊緣：用一圈小圓弧代替平滑的橢圓輪廓 -->
        <path d="M50 35
                 c14 0 26 5 31 14 q4 3 2 7 q3 4 0 8 q2 5 -2 9 q1 5 -4 8
                 q-3 5 -9 7 q-8 5 -18 5 t-18 -5 q-6 -2 -9 -7 q-5 -3 -4 -8
                 q-4 -4 -2 -9 q-3 -4 0 -8 q-2 -4 2 -7 c5 -9 17 -14 31 -14 z"
              fill="url(#hmBody)" stroke-width="2.2"/>
        <!-- 肚子淺色區 -->
        <ellipse cx="50" cy="72" rx="21" ry="18" fill="url(#hmBelly)" stroke="none" opacity=".92"/>

        <!-- 手（保留 class，JS/CSS 目前沒用但別動它） -->
        <g stroke-width="2">
            <ellipse class="arm-l" cx="19" cy="62" rx="7" ry="6" fill="#eeb277"/>
            <ellipse class="arm-r" cx="81" cy="62" rx="7" ry="6" fill="#eeb277"/>
        </g>
        <g stroke="#dd9a8f" stroke-width="1" opacity=".55" fill="none">
            <path d="M16 60 v5 M19 59 v6 M22 60 v5"/>
            <path d="M78 60 v5 M81 59 v6 M84 60 v5"/>
        </g>

        <!-- 腳掌 -->
        <g stroke-width="1.8">
            <ellipse cx="32" cy="88" rx="9" ry="5.5" fill="url(#hmPaw)"/>
            <ellipse cx="68" cy="88" rx="9" ry="5.5" fill="url(#hmPaw)"/>
        </g>
        <g stroke="#dd8fa0" stroke-width="1" opacity=".6" fill="none">
            <path d="M28 86.5 v3 M32 86 v4 M36 86.5 v3"/>
            <path d="M64 86.5 v3 M68 86 v4 M72 86.5 v3"/>
        </g>

        <!-- 頭 -->
        <circle cx="50" cy="45" r="25" fill="url(#hmHead)" stroke-width="2.2"/>
        <!-- 兩頰的腮幫子，讓側臉不是一個正圓 -->
        <ellipse cx="30" cy="52" rx="10" ry="8.5" fill="url(#hmHead)" stroke-width="2"/>
        <ellipse cx="70" cy="52" rx="10" ry="8.5" fill="url(#hmHead)" stroke-width="2"/>
        <!-- 額頭高光 -->
        <ellipse cx="41" cy="33" rx="10" ry="6" fill="#fff" opacity=".28" stroke="none"
                 transform="rotate(-18 41 33)"/>

        <!-- 腮紅 -->
        <g stroke="none">
            <ellipse cx="31" cy="50" rx="6" ry="4" fill="#ff9db4" opacity=".45"/>
            <ellipse cx="69" cy="50" rx="6" ry="4" fill="#ff9db4" opacity=".45"/>
        </g>

        <!-- 眼睛。整組給 class="eye"，睡覺時 CSS 會把整組 display:none -->
        <g class="eye" stroke="none">
            <ellipse cx="39" cy="41" rx="5" ry="5.6" fill="#3b2a21"/>
            <circle cx="37.2" cy="38.8" r="1.9" fill="#fff"/>
            <circle cx="40.6" cy="43.2" r="1" fill="#fff" opacity=".7"/>
        </g>
        <g class="eye" stroke="none">
            <ellipse cx="61" cy="41" rx="5" ry="5.6" fill="#3b2a21"/>
            <circle cx="59.2" cy="38.8" r="1.9" fill="#fff"/>
            <circle cx="62.6" cy="43.2" r="1" fill="#fff" opacity=".7"/>
        </g>
        <!-- 閉眼（預設隱藏，睡覺時 CSS 顯示） -->
        <path class="eye-closed" d="M 34 41 Q 39 45 44 41" fill="none" stroke="#3b2a21" stroke-width="2.4" style="display:none;"/>
        <path class="eye-closed" d="M 56 41 Q 61 45 66 41" fill="none" stroke="#3b2a21" stroke-width="2.4" style="display:none;"/>

        <!-- 鼻子 -->
        <path d="M46 51 q4 -3 8 0 q-1 4 -4 5 q-3 -1 -4 -5 z" fill="#f2899f" stroke="#c96a80" stroke-width="1.4"/>
        <ellipse cx="48" cy="51.5" rx="1.4" ry="0.9" fill="#fff" opacity=".6" stroke="none"/>

        <!-- 嘴巴。JS 開心時會把 d 換成 "M 45 57 Q 50 63 55 57 Q 50 52 45 57"，
             所以位置要留在 x42-58 / y52-62 這一帶 -->
        <path class="mouth" d="M 50 56 Q 45 61 41 57 M 50 56 Q 55 61 59 57"
              fill="none" stroke="#7d4f2e" stroke-width="2"/>

        <!-- 鬍鬚 -->
        <g stroke="#c08b5e" stroke-width="1.1" opacity=".75" fill="none">
            <path d="M26 49 q-8 -2 -12 -4 M26 53 q-9 1 -13 1"/>
            <path d="M74 49 q8 -2 12 -4 M74 53 q9 1 13 1"/>
        </g>
    </g>

    <!-- 配件群組（JS 塞固定座標的 SVG 進來，位置不能動） -->
    
    
</svg>
