<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EA">
<title>今天 · Daisy v2</title>
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="core/ui.css">
<style>
  .corner { font-family: var(--font-en); font-size: 15px; color: var(--ink-2); min-height: var(--tap-icon); padding: 0 12px; }
  .badge { background: var(--wheat-t); font-size: 16px; }
  #chest .stage { text-align: center; }
  .chest-title { font-size: clamp(34px, 8.5vw, 44px); font-weight: 700; }
  /* 手機：標題縮小一點；「試玩」標示另起一行，不然會把標題和 🔊 擠出畫面（截圖抓到的） */
  @media (max-width: 480px) {
    #headline { font-size: 18px; padding: 4px 10px; gap: 4px; }
    #demo, #coins-chip { position: fixed; right: 16px; top: calc(68px + env(safe-area-inset-top)); min-height: 40px; z-index: 2; }
  }
  .streak { font-size: 22px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: var(--persimmon-t); }
</style>
</head>
<body>

<!-- 鉛筆描邊的濾鏡（.sketch 用） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<!-- ① 今天：一條小徑 -->
<section class="screen on" id="today" aria-label="今天">
  <div class="topbar">
    <a class="chip sketch corner" href="../daisy_hamster.html" aria-label="回 v1">v1</a>
    <button class="chip sketch" id="headline"></button>
    <span class="grow"></span>
    <button class="chip sketch badge" id="demo" hidden></button>
    <span class="chip sketch" id="coins-chip" hidden><span aria-hidden="true">🪙</span><span class="coin" id="coins">—</span></span>
  </div>
  <div class="trail-wrap" id="trail"></div>
  <nav class="tabbar">
    <button class="tab" aria-current="page"><span class="ti">🛤️</span><span class="zh" data-zy="今天|ㄐㄧㄣ ㄊㄧㄢ"></span></button>
    <a class="tab" href="lab/planet.html"><span class="ti"><img src="art/hamster.svg" alt=""></span><span class="zh" data-zy="倉鼠|ㄘㄤ ㄕㄨˇ"></span></a>
    <a class="tab" href="../daisy_practice.html"><span class="ti">📚</span><span class="zh" data-zy="書架|ㄕㄨ ㄐㄧㄚˋ"></span></a>
  </nav>
</section>

<!-- ② 每一關（activities.js 畫在這裡） -->
<section class="screen" id="play" aria-label="練習"></section>

<!-- ③ 寶箱 -->
<section class="screen c-wheat" id="chest" aria-label="寶箱">
  <div class="topbar">
    <button class="icon-btn sketch" data-home aria-label="回到小徑">✕</button>
    <span class="grow"></span>
  </div>
  <div class="stage">
    <button class="chest-title zh" data-zy="今天完成了|ㄐㄧㄣ ㄊㄧㄢ ㄨㄢˊ ㄔㄥˊ ㄌㄜ˙" data-say="今天完成了！"></button>
    <div class="chest-scene" id="chest-scene">
      <img class="hamster-big" src="art/hamster.svg" alt="">
      <svg class="chest" viewBox="0 0 170 150" aria-hidden="true">
        <ellipse class="glow" cx="85" cy="70" rx="70" ry="34" fill="var(--wheat-t)"/>
        <g stroke="var(--line-ink)" stroke-width="3" stroke-linejoin="round">
          <rect x="14" y="70" width="142" height="74" rx="10" fill="var(--wheat)"/>
          <rect x="14" y="96" width="142" height="12" fill="var(--wheat-d)"/>
          <rect x="74" y="88" width="22" height="28" rx="5" fill="var(--surface)"/>
          <g class="lid">
            <path d="M14 72 V54 Q14 22 85 22 Q156 22 156 54 V72 Z" fill="var(--wheat)"/>
            <path d="M40 30 Q40 60 40 72 M130 30 Q130 60 130 72" fill="none" stroke="var(--wheat-d)" stroke-width="10"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="reward" id="reward" aria-live="polite"></div>
    <div class="streak sketch" id="streak" hidden></div>
    <button class="btn wide sketch hatch" id="chest-btn" style="max-width:520px"></button>
  </div>
</section>

<div class="toast hide" id="toast"></div>

<script src="../zhuyin.js"></script>
<script src="../audio.js"></script>
<script src="../firebase-config.js"></script>
<script src="../rewards.js"></script>
<script src="../words.js"></script>
<script src="../calendar.js"></script>
<script src="../mastery.js"></script>
<script type="module">
import { planToday } from './core/planner.js';
import { runStation } from './core/activities.js';
import { $, $$, zy, meaningOf, say, sfx, unlockAudio, award, loginCode } from './core/kit.js';

// 一關 5 金幣、寶箱 40：整條小徑走完 55–60 枚，比 v1 拼十個字（20–30）或任何
// 一個每日挑戰（6–16）都多 —— 「做完今日任務」要明顯是賺最多的方式
const REWARD = { station: 5, chest: 40 };

$$('[data-zy]').forEach((el) => { const [a, b] = el.dataset.zy.split('|'); el.innerHTML = zy(a, b); });
document.addEventListener('click', (e) => { const s = e.target.closest('[data-say]'); if (s) say(s.dataset.say); });
document.addEventListener('pointerdown', unlockAudio, { once: true });

// ── 今天（台北時間）。?date=YYYYMMDD 可以預覽別天的小徑 ──────────────────
const params = new URLSearchParams(location.search);
const ymd = params.get('date') ? +params.get('date') : taipeiDay();
const KEY = 'daisy2_today_' + ymd, SEEN = 'daisy2_seen';
const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// ★ 一天的小徑第一次打開時就定下來、存起來。練到一半記憶盒變了，
//   重排會換一批字，前面做的就白做了
let state = read(KEY, null) || { v: 1, plan: null, done: [], rewarded: [], chest: false };
const save = () => write(KEY, state);

/** 這學期到這週為止學過的字 —— 出錯誤選項用 */
function termWords(week) {
  const out = new Set();
  const lists = [TERM.lists.fet, TERM.lists.cet];
  if (week.kind === 'review') reviewScope(week.n).forEach(({ list, key }) => (words[list][key] || []).forEach((w) => out.add(w)));
  else lists.forEach((l) => Object.entries(words[l] || {}).forEach(([k, arr]) => {
    const ns = (k.match(/\d+/g) || []).map(Number);
    if (ns.length && Math.min(...ns) <= Math.max(1, week.n)) arr.forEach((w) => out.add(w));
  }));
  return [...out].filter((w) => meaningOf(w));
}

function makePlan() {
  const week = currentWeek(ymd);
  return planToday({
    ymd, week, words, lists: TERM.lists,
    scope: week.kind === 'review' ? reviewScope(week.n) : null,
    mastery: readMastery(), seen: read(SEEN, {}),
    hasMeaning: (w) => !!meaningOf(w),
  });
}

// ── 金幣 ──────────────────────────────────────────────────────────────
const code = loginCode();
let coins = null;
function showCoins(n) {
  const chip = $('#coins-chip');
  if (coins != null && n !== coins) { chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
  coins = n; $('#coins').textContent = (n || 0).toLocaleString();
}
if (code) {
  $('#coins-chip').hidden = false;
  getFirebaseDb().then((db) => { if (db) db.ref('users/' + code + '/petData/coins').on('value', (s) => showCoins(s.val() || 0)); });
} else {
  // 沒登入也能玩，但金幣存不進去 —— 說清楚，不要讓她以為賺到了
  const d = $('#demo'); d.hidden = false;
  d.innerHTML = zy('試玩', 'ㄕˋ ㄨㄢˊ');
  d.dataset.say = '還沒登入，金幣不會存起來。請先在 v1 輸入通關密碼。';
}

// ════════════════════════════════════════════════════════════════════
// 小徑
// ════════════════════════════════════════════════════════════════════
const stations = () => state.plan.stations;
const firstUndone = () => { const i = stations().findIndex((s) => s.type !== 'chest' && !state.done.includes(s.id)); return i < 0 ? stations().length - 1 : i; };
function stationState(i) {
  const s = stations()[i], now = firstUndone();
  if (s.type === 'chest') return state.chest ? 'done' : (i === now ? 'now' : 'later');
  return state.done.includes(s.id) ? 'done' : (i === now ? 'now' : 'later');
}

function points(w, h) {
  const n = stations().length, land = w > h * 1.15;
  return stations().map((_, i) => {
    const t = n === 1 ? 0.5 : i / (n - 1);
    return land ? { x: w * (0.1 + 0.8 * t), y: h * (0.5 + (i % 2 ? 0.17 : -0.17)) }
                : { x: w * (0.5 + (i === n - 1 ? 0 : (i % 2 ? 0.23 : -0.23))), y: h * (0.12 + 0.76 * t) };
  });
}
function smoothPath(p, land) {
  let d = `M${p[0].x},${p[0].y}`;
  for (let i = 1; i < p.length; i++) {
    const a = p[i - 1], b = p[i];
    d += land ? ` C${(a.x + b.x) / 2},${a.y} ${(a.x + b.x) / 2},${b.y} ${b.x},${b.y}`
              : ` C${a.x},${(a.y + b.y) / 2} ${b.x},${(a.y + b.y) / 2} ${b.x},${b.y}`;
  }
  return d;
}
/** 繪本風的小樹叢（和世界地圖、設計稿同一種）。固定種子，每次畫都一樣 */
function trees(w, h, pts) {
  let x = 7, out = '';
  const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  for (let k = 0; k < 22; k++) {
    const cx = rnd() * w, cy = rnd() * h;
    if (pts.some((p) => Math.hypot(p.x - cx, p.y - cy) < 82)) continue;
    const r = 7 + rnd() * 9;
    out += `<g opacity=".85">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--leaf-t)" stroke="var(--leaf)" stroke-width="1.4" filter="url(#wobble)"/>
      <circle cx="${cx + r * .8}" cy="${cy + r * .35}" r="${r * .7}" fill="var(--leaf-t)" stroke="var(--leaf)" stroke-width="1.4" filter="url(#wobble)"/>
      <line x1="${cx + r * .3}" y1="${cy + r}" x2="${cx + r * .3}" y2="${cy + r * 1.6}" stroke="var(--ink-2)" stroke-width="1.6"/>
    </g>`;
  }
  return out;
}

function drawTrail() {
  const box = $('#trail'); if (!box.offsetParent) return;
  const w = box.clientWidth, h = box.clientHeight, land = w > h * 1.15;
  const pts = points(w, h);
  box.innerHTML = `<svg class="trail-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true">${trees(w, h, pts)}
      <path class="trail-path" d="${smoothPath(pts, land)}"/></svg>`
    + stations().map((s, i) => `
      <div class="station ${stationState(i)} c-${s.color}" data-i="${i}" style="left:${pts[i].x}px; top:${pts[i].y}px">
        <button class="dot sketch hatch" aria-label="${s.name}"><span class="em">${s.em}</span></button>
        <span class="name zh">${zy(s.name, s.zy)}</span>
        ${s.words.length ? `<span class="count">${s.words.length}</span>` : ''}
      </div>`).join('')
    + `<div class="trail-ham" id="ham"><img src="art/hamster.svg" alt=""></div>`;
  placeHam(false);
}
function placeHam(animate) {
  const box = $('#trail'), ham = $('#ham'); if (!ham) return;
  const pts = points(box.clientWidth, box.clientHeight), land = box.clientWidth > box.clientHeight * 1.15;
  const i = firstUndone(), p = pts[i];
  if (!animate) ham.style.transition = 'none';
  ham.style.left = (p.x + (land ? 0 : (i % 2 ? -82 : 82))) + 'px';
  ham.style.top = (p.y - (land ? 48 : 0)) + 'px';
  if (!animate) { void ham.offsetWidth; ham.style.transition = ''; }
}
addEventListener('resize', drawTrail);

function renderHeadline() {
  const p = state.plan;
  $('#headline').innerHTML = p.headline.map((h) => `<span class="zh">${zy(h.zh, h.zy)}</span>`).join('<span style="color:var(--ink-2)"> · </span>') + ' <span aria-hidden="true">🔊</span>';
  const n = p.stations.filter((s) => s.type !== 'chest').length;
  $('#headline').dataset.say = '今天是' + p.headline.map((h) => h.zh).join('，') + '。今天有' + n + '關，走到最後可以開寶箱。';
}

$('#trail').addEventListener('click', (e) => {
  const st = e.target.closest('.station'); if (!st) return;
  const i = +st.dataset.i, s = stations()[i], ss = stationState(i);
  if (ss === 'later') {
    sfx('bump'); st.classList.remove('nudge'); void st.offsetWidth; st.classList.add('nudge');
    say('先完成前面的關卡喔。'); return;
  }
  if (s.type === 'chest') return openChest();
  play(s);
});

// ════════════════════════════════════════════════════════════════════
// 闖關
// ════════════════════════════════════════════════════════════════════
const show = (id) => $$('.screen').forEach((x) => x.classList.toggle('on', x.id === id));
let distractors = [];

async function play(s) {
  unlockAudio();
  show('play');
  const res = await runStation($('#play'), s, {
    distractors,
    record: (w, ok, errs, skill) => { try { recordAttempt(w, ok, errs, skill); } catch (e) { console.warn(e); } },
    markSeen: (w) => { const m = read(SEEN, {}); m[w.toLowerCase()] = ymd; write(SEEN, m); },
  });
  if (res.aborted) { show('today'); drawTrail(); return; }

  const first = !state.done.includes(s.id);
  if (first) { state.done.push(s.id); save(); }
  // 一關的金幣一天只發一次（重玩一次已經過的關卡不再發）
  let paid = false;
  if (first && !state.rewarded.includes(s.id)) {
    state.rewarded.push(s.id); save();
    paid = await award(REWARD.station);
  }
  // 過關畫面
  $('#play').innerHTML = `<div class="stage"><div class="done-burst">
      <span class="big">✨</span>
      <span class="zh">${zy('完成', 'ㄨㄢˊ ㄔㄥˊ')}</span>
      ${s.type !== 'card' ? `<span style="font-size:24px;color:var(--ink-2)" class="en">${res.right} / ${res.total}</span>` : ''}
      ${paid ? `<span class="coin">+${REWARD.station} 🪙</span>` : ''}
    </div></div>`;
  sfx('levelup');
  say(res.right === res.total || s.type === 'card' ? '太棒了！' : '完成了！');
  setTimeout(() => { show('today'); drawTrail(); requestAnimationFrame(() => placeHam(true)); }, 1600);
}

// ════════════════════════════════════════════════════════════════════
// 寶箱
// ════════════════════════════════════════════════════════════════════
function streakDays() {
  let n = 0, d = ymd;
  for (; n < 365; n++) { const st = read('daisy2_today_' + d, null); if (!st || !st.chest) break; d = addDays(d, -1); }
  return n;
}
function openChest() {
  show('chest');
  const scene = $('#chest-scene'), btn = $('#chest-btn');
  scene.classList.toggle('open', !!state.chest);
  $('#reward').textContent = '';
  const goPlay = () => {
    btn.innerHTML = '<img src="art/hamster.svg" alt="" style="width:30px">' + zy('去找倉鼠玩', 'ㄑㄩˋ ㄓㄠˇ ㄘㄤ ㄕㄨˇ ㄨㄢˊ');
    btn.onclick = () => { sfx('whoosh'); location.href = 'lab/planet.html'; };
    const n = streakDays();
    $('#streak').hidden = n < 2;
    $('#streak').innerHTML = '🔥 ' + zy('連續', 'ㄌㄧㄢˊ ㄒㄩˋ') + ' <span class="en">' + n + '</span> ' + zy('天', 'ㄊㄧㄢ');
  };
  if (state.chest) { goPlay(); return; }
  btn.innerHTML = '<span aria-hidden="true">🎁</span>' + zy('打開寶箱', 'ㄉㄚˇ ㄎㄞ ㄅㄠˇ ㄒㄧㄤ');
  btn.onclick = async () => {
    if (state.chest) return;
    state.chest = true; save();
    scene.classList.add('open'); sfx('levelup');
    for (let i = 0; i < 12; i++) {
      const c = document.createElement('span');
      c.className = 'fly-coin'; c.textContent = '🪙';
      c.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px');
      c.style.setProperty('--dy', (-60 - Math.random() * 130) + 'px');
      c.style.setProperty('--r', (Math.random() * 360) + 'deg');
      c.style.animationDelay = (i * 45) + 'ms';
      scene.appendChild(c); setTimeout(() => c.remove(), 1600);
    }
    const paid = await award(REWARD.chest);
    $('#reward').textContent = paid ? '+' + REWARD.chest + ' 🪙' : '✨';
    say(paid ? '拿到' + REWARD.chest + '個金幣！' : '今天完成了！');
    setTimeout(goPlay, 1100);
  };
}
$$('[data-home]').forEach((b) => b.onclick = () => { show('today'); drawTrail(); });

// ════════════════════════════════════════════════════════════════════
// 開場
// ════════════════════════════════════════════════════════════════════
async function boot() {
  if (code && !state.plan) {
    // 換裝置的時候，記憶盒在雲端：先同步再排（最多等 2.5 秒，網路慢就用本機的）
    await Promise.race([new Promise((r) => syncMastery(() => r())), new Promise((r) => setTimeout(r, 2500))]);
    // 主頁 v1 自己記的錯字清單，併進拼字的記憶盒
    try {
      const db = await getFirebaseDb();
      if (db) {
        const snap = await Promise.race([db.ref('users/' + code + '/petData/stats/mistakeWords').once('value'), new Promise((r) => setTimeout(() => r(null), 2000))]);
        if (snap && snap.val()) importLegacyMistakes(snap.val());
      }
    } catch (e) {}
  }
  if (!state.plan) { state.plan = makePlan(); save(); }
  distractors = termWords(currentWeek(ymd));
  // 只留最近兩週的小徑紀錄
  try { Object.keys(localStorage).filter((k) => k.startsWith('daisy2_today_') && +k.slice(13) < addDays(ymd, -14)).forEach((k) => localStorage.removeItem(k)); } catch (e) {}
  renderHeadline();
  drawTrail();
  window.today = { state, ymd, play, openChest };
}
boot();
</script>
</body>
</html>
